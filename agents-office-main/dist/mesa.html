<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Órbita — a mesa de trabalho</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<style>
  /* Órbita — a mesa de trabalho.
     Uma superfície sóbria para o trabalho que se faz todos os dias: o que precisa de ti, os
     leads, a conversa com cada um, o dinheiro. O escritório 3D é onde os agentes vivem; aqui é
     onde tu decides.
     Tokens desde o dia 1: espaçamento em múltiplos de 4, uma escala tipográfica, quatro cores
     semânticas. Nada abaixo inventa um valor que não venha destes. */
  :root {
    /* 1.57.0 · tokens do redesenho: fundo quase branco, tinta quase preta, um
       azul só (#155EEF) e bordas de 1 px. Os nomes antigos ficam — mudar os
       nomes obrigaria a tocar em todas as vistas sem ganho nenhum. */
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --ink: #111318;
    --muted: #667085;
    --faint: #98A2B3;
    --hair: #E2E6ED;
    --hair-strong: #D0D5DD;
    --blue: #155EEF;
    --blue-soft: #EAF2FF;
    --blue-soft-2: #DCE8FF;
    --ok: #12A150; --ok-soft: #ECFDF3;
    --warn: #B54708; --warn-soft: #FFFAEB;
    --risk: #B42318; --risk-soft: #FEF3F2;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --t-xs: 11px; --t-s: 13px; --t-m: 15px; --t-l: 18px; --t-xl: 26px; --t-2xl: 40px;
    --r-s: 9px; --r-m: 12px; --r-l: 16px; --r-xl: 20px;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px -18px rgba(16,24,40,.35);
    --ease: cubic-bezier(.2,.8,.2,1);
    --side: 248px;
    --head: 76px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--ui); font-size: var(--t-m); line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }

  /* ---------- estrutura ---------- */
  .shell { display: flex; min-height: 100vh; }
  .side {
    width: var(--side); flex: none; padding: 20px 16px;
    display: flex; flex-direction: column; gap: 20px;
    position: sticky; top: 0; height: 100vh;
    background: var(--card); border-right: 1px solid var(--hair);
  }
  /* o X de sair: a mesa é uma página inteira, e sem isto só se sai pelo endereço.
     Fica ao lado da marca, no canto, com 44 px de alvo (o mínimo para o dedo). */
  .side-top { display: flex; align-items: center; gap: var(--s2); padding-bottom: 16px; border-bottom: 1px solid var(--hair); }
  .side-top .brand { flex: 1; }
  .side-x {
    width: 34px; height: 34px; flex: none; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); border: 1px solid transparent;
    transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
  }
  .side-x:hover { background: rgba(27,27,31,.06); color: var(--ink); border-color: var(--hair); }
  .side-x svg { width: 15px; height: 15px; }
  .brand { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2); font-size: 18px; font-weight: 680; letter-spacing: -.02em; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    border: 2.5px solid var(--blue); position: relative;
  }
  .brand .mark::after {
    content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--blue);
  }
  /* 12 secções não cabem em todos os ecrãs: é a lista que desliza, não a página
     — o cartão do fundo fica sempre à vista */
  .nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; scrollbar-width: thin; }
  .nav a > span:first-of-type { flex: 1; }
  .nav a {
    display: flex; align-items: center; gap: 10px; min-height: 40px;
    padding: 9px var(--s3); border-radius: var(--r-s);
    font-size: 14px; color: var(--ink); font-weight: 500;
    transition: background .16s var(--ease), color .16s var(--ease);
  }
  .nav a:hover { background: rgba(27,27,31,.05); }
  .nav a.on { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .nav a .ic { width: 20px; height: 20px; flex: none; color: var(--muted); }
  .nav a.on .ic { color: var(--blue); }
  .nav a .n { margin-left: auto; font-size: var(--t-xs); color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav a.on .n { color: var(--blue); }

  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--s3); }
  .meter { background: rgba(255,255,255,.7); border: 1px solid var(--hair); border-radius: var(--r-m); padding: var(--s3) var(--s4); }
  .meter .mrow { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
  .meter .lbl { font-size: var(--t-xs); color: var(--muted); letter-spacing: .01em; }
  .meter b { font-size: var(--t-m); font-variant-numeric: tabular-nums; font-weight: 600; }
  .meter .bar { height: 4px; border-radius: 4px; background: var(--hair); margin-top: var(--s2); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; transition: width .4s var(--ease); }
  .meter small { display: block; margin-top: var(--s2); font-size: var(--t-xs); color: var(--faint); }
  .espaco { display: flex; flex-direction: column; gap: 2px; padding: 0 var(--s2); }
  .espaco label { font-size: var(--t-xs); color: var(--faint); }
  .espaco select { border: 1px solid var(--hair); background: #fff; border-radius: var(--r-s); padding: 6px var(--s2); font-size: var(--t-s); max-width: 100%; }

  /* 1.57.0 · a coluna do trabalho: cabeçalho fixo em cima, conteúdo por baixo.
     O cabeçalho é branco, 76 px, com um divisor de 1 px — a pesquisa global, as
     notificações e a conta vivem aqui, iguais em todas as páginas. */
  .work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .app-head {
    height: var(--head); flex: none; position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--hair);
  }
  .hsearch { position: relative; flex: 1; max-width: 520px; }
  .hsearch .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--faint); pointer-events: none; }
  .hsearch input {
    width: 100%; height: 40px; padding: 0 72px 0 38px;
    border: 1px solid var(--hair); border-radius: var(--r-s); background: #fff;
    font-size: 14px; color: var(--ink); transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .hsearch input::placeholder { color: var(--faint); }
  .hsearch input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .hsearch kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font: 500 11px/1 var(--ui); color: var(--muted); background: #F2F4F7;
    border: 1px solid var(--hair); border-radius: 6px; padding: 4px 6px;
  }
  .hres {
    position: absolute; left: 0; right: 0; top: 46px; z-index: 40;
    background: #fff; border: 1px solid var(--hair); border-radius: var(--r-m);
    box-shadow: 0 12px 32px -16px rgba(16,24,40,.35); padding: 6px; max-height: 60vh; overflow: auto;
  }
  .hres[hidden] { display: none; }
  .hres .sec-h { margin: 6px 8px 2px; }
  .hres a { display: block; padding: 8px; border-radius: 8px; font-size: 14px; }
  .hres a:hover { background: #F8FAFC; }
  .hres .vazio { padding: 10px 8px; color: var(--muted); font-size: 13px; }
  .hacts { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .hicon {
    width: 44px; height: 44px; border-radius: 10px; position: relative;
    display: inline-flex; align-items: center; justify-content: center; color: var(--muted);
    transition: background .16s var(--ease), color .16s var(--ease);
  }
  .hicon:hover { background: #F2F4F7; color: var(--ink); }
  .hicon .ic { width: 20px; height: 20px; }
  .hicon .ndot {
    position: absolute; top: 8px; right: 9px; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px; background: var(--blue); color: #fff; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; border: 2px solid #fff;
  }
  .huser { display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 4px; border-radius: 10px; }
  .huser:hover { background: #F2F4F7; }
  .huser .av {
    width: 36px; height: 36px; border-radius: 50%; background: var(--blue-soft); color: var(--blue);
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    flex: none; overflow: hidden;
  }
  .huser .av img { width: 100%; height: 100%; object-fit: cover; }
  .huser .who { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
  .huser .who b { font-size: 13.5px; font-weight: 600; }
  .huser .who span { font-size: 12px; color: var(--muted); }
  .huser summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .huser summary::-webkit-details-marker { display: none; }
  .hmenu { position: relative; }
  .hmenu-l {
    position: absolute; right: 0; top: 48px; z-index: 40; min-width: 210px;
    background: #fff; border: 1px solid var(--hair); border-radius: var(--r-m);
    box-shadow: 0 12px 32px -16px rgba(16,24,40,.35); padding: 6px;
  }
  .hmenu-l a, .hmenu-l button { display: flex; width: 100%; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-align: left; }
  .hmenu-l a:hover, .hmenu-l button:hover { background: #F8FAFC; }
  .hmenu-l .sep { height: 1px; background: var(--hair); margin: 6px 0; }
  main { flex: 1; min-width: 0; padding: var(--s6) var(--s6) var(--s7); }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s5); }
  .head h1 { font-size: var(--t-2xl); font-weight: 680; letter-spacing: -.025em; line-height: 1.1; }
  .head .sub { margin-top: 6px; color: var(--muted); font-size: var(--t-m); }
  .head .sub b { color: var(--ink); font-weight: 600; }
  .head-acts { display: flex; gap: var(--s2); align-items: center; flex: none; }

  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    min-height: 42px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    background: var(--blue-soft); color: var(--blue); border: 1px solid transparent;
    cursor: pointer; font-family: inherit;
    transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
  }
  .pill:hover { background: var(--blue-soft-2); }
  .pill:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .pill .ic { width: 18px; height: 18px; }
  .pill.stop { background: var(--risk-soft); color: var(--risk); }
  .pill small { font-weight: 450; opacity: .8; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s3); margin-bottom: var(--s6); }
  .stat { background: var(--card); border-radius: var(--r-l); padding: var(--s4) var(--s5); box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 32px; font-weight: 650; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat b.blue { color: var(--blue); }
  .stat span { display: block; margin-top: 2px; color: var(--muted); font-size: var(--t-s); }

  h2 { font-size: var(--t-xl); font-weight: 650; letter-spacing: -.02em; }
  h3 { font-size: var(--t-l); font-weight: 620; letter-spacing: -.01em; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }
  .sec-h .count { color: var(--muted); font-size: var(--t-s); }

  /* ---------- o par: lista + aprovação ---------- */
  .split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: var(--s5); align-items: start; }
  .list { display: flex; flex-direction: column; gap: var(--s2); }
  .item {
    display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left;
    background: var(--card); border-radius: var(--r-l); padding: 15px var(--s4);
    border: 1.5px solid transparent; box-shadow: var(--shadow);
    transition: border-color .18s var(--ease), transform .18s var(--ease);
  }
  .item:hover { transform: translateY(-1px); }
  .item.on { border-color: var(--blue); }
  .item .who { min-width: 0; flex: 1; }
  .item .nm { font-size: 16px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .mt { color: var(--muted); font-size: var(--t-s); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: none; font-size: var(--t-s); font-weight: 600; padding: 5px 10px; border-radius: 999px;
    background: var(--ok-soft); color: var(--ok); font-variant-numeric: tabular-nums;
  }
  .badge.mid { background: var(--warn-soft); color: var(--warn); }
  .badge.low { background: #F1F1F3; color: var(--muted); }
  .badge.blue { background: var(--blue-soft); color: var(--blue); }

  .card { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-l); padding: var(--s5); box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); }
  .detail-top h3 { font-size: 28px; font-weight: 650; letter-spacing: -.025em; }
  .detail-top .mt { color: var(--muted); margin-top: 4px; font-size: var(--t-m); }
  .msg-label { display: flex; align-items: center; gap: var(--s2); color: var(--muted); font-size: var(--t-s); margin: var(--s5) 0 var(--s2); }
  .msg-label .ic { width: 16px; height: 16px; }
  .bubble {
    background: #EFF0FE; border-radius: var(--r-m); padding: var(--s4) var(--s5);
    font-size: var(--t-l); line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .why-box { border: 1px solid var(--hair); border-radius: var(--r-m); padding: var(--s3) var(--s4); margin-top: var(--s4); }
  .why-box summary { list-style: none; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 600; }
  .why-box summary::-webkit-details-marker { display: none; }
  .why-box summary span { color: var(--muted); font-weight: 400; font-size: var(--t-s); display: block; }
  .why-box summary .chev { transition: transform .2s var(--ease); color: var(--faint); }
  .why-box[open] summary .chev { transform: rotate(90deg); }
  .why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin-top: var(--s4); }
  .why {
    display: flex; gap: var(--s3); align-items: flex-start; background: #F6F6F8;
    border-radius: var(--r-s); padding: var(--s3) var(--s4); font-size: var(--t-s); line-height: 1.35;
  }
  .why .tick { color: var(--ok); flex: none; margin-top: 1px; }
  /* =========================================================================
     1.57.1 · OS BOTÕES
     Um botão tem de se ver que é um botão e de se acertar com o dedo. Altura
     mínima de 46 px (48 no telemóvel), 20 px de respiro lateral, raio de 11 px,
     ícone de 18 px alinhado ao texto, e três estados que se distinguem sem
     adivinhar: repouso com sombra de 1 px, hover que escurece o fundo, e
     `:focus-visible` com anel de 2 px — quem navega por teclado vê onde está.
     `.small` é para tabelas e cabeçalhos (38 px); `.quiet` não tem caixa.
     ========================================================================= */
  .acts { display: flex; gap: 10px; margin-top: var(--s5); flex-wrap: wrap; }
  .btn {
    --btn-h: 46px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: var(--btn-h); padding: 0 20px; border-radius: 11px;
    font-family: inherit; font-size: 14.5px; line-height: 1; font-weight: 600; letter-spacing: -.005em;
    white-space: nowrap; border: 1px solid transparent; cursor: pointer;
    background: #fff; color: var(--ink);
    box-shadow: 0 1px 2px rgba(16, 24, 40, .05);
    transition: background .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease),
      box-shadow .16s var(--ease), transform .1s var(--ease);
  }
  .btn .ic { width: 18px; height: 18px; flex: none; }
  .btn:hover { box-shadow: 0 2px 8px -2px rgba(16, 24, 40, .16); }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn.primary {
    background: var(--blue); border-color: var(--blue); color: #fff;
    box-shadow: 0 1px 2px rgba(21, 94, 239, .30), 0 8px 18px -12px rgba(21, 94, 239, .9);
  }
  .btn.primary:hover { background: #004EEB; border-color: #004EEB; }
  .btn.ghost { background: #fff; border-color: var(--hair-strong); color: var(--ink); }
  .btn.ghost:hover { background: #F8FAFC; border-color: #B9C0CC; }
  .btn.quiet {
    background: transparent; border-color: transparent; color: var(--muted);
    box-shadow: none; padding: 0 12px;
  }
  .btn.quiet:hover { background: #F2F4F7; color: var(--ink); box-shadow: none; }
  .btn.danger { background: #fff; border-color: #F2C3BE; color: var(--risk); }
  .btn.danger:hover { background: var(--risk-soft); border-color: var(--risk); }
  .btn.small { --btn-h: 38px; padding: 0 14px; font-size: 13px; border-radius: 9px; gap: 6px; }
  .btn.small .ic { width: 16px; height: 16px; }
  .btn:disabled, .btn[aria-disabled="true"] {
    opacity: .48; cursor: not-allowed; box-shadow: none; transform: none;
  }
  /* os botões dentro de `.acts` têm largura mínima confortável em vez de esticar
     até ao fim do cartão — dois botões de 500 px não se lêem melhor */
  .acts > .btn { min-width: 148px; }

  /* 30 out 2026 · o aviso do modo local (pedido do dono: «chega de demonstrações só»).
     Não é um erro e não se fecha: é a informação de onde os dados vivem. Discreto no
     desktop, duas linhas no telemóvel, e as acções da cópia sempre à mão. */
  .localbar {
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    margin: var(--s3) var(--s4) 0; padding: 10px 12px 10px 14px;
    background: #FFF8E6; border: 1px solid #F0DCB0; border-radius: var(--r2, 12px);
    font-size: var(--t-xs, 12px); line-height: 1.45; color: #6B5320;
  }
  .localbar b { color: #4A3A12; }
  .localbar > span:first-child { flex: 1 1 260px; min-width: 0; }
  .localbar .lb-act { display: flex; gap: 4px; flex: none; }
  .localbar .btn { color: #6B5320; }
  .localbar .btn:hover { color: #2F2609; }
  @media (max-width: 720px) {
    .localbar { margin: var(--s2) var(--s2) 0; font-size: 12px; }
    .localbar .lb-act { width: 100%; justify-content: flex-end; flex-wrap: wrap; }
  }
  /* ---- 1.18.0 · AI Control Center ---- */
  .ia-faixa { margin: var(--s3) var(--s4) 0; padding: 12px 14px; border-radius: var(--r2, 12px);
    font-size: var(--t-sm, 14px); line-height: 1.5; border: 1px solid; }
  .ia-faixa.ok { background: #EDF9F1; border-color: #CBE9D5; color: #1F5B37; }
  .ia-faixa.bad { background: #FDF3EC; border-color: #F3D9C6; color: #7A4115; }
  /* 1.50.0 · a conversa da IA: mensagens com quem falou e o que respondeu */
  .ia-chat { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto;
    padding: 10px 12px; margin: 0 0 10px; border: 1px solid var(--line); border-radius: var(--r2, 12px);
    background: var(--paper-2, rgba(0,0,0,.02)); }
  .ia-msg { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; line-height: 1.5; max-width: 78ch; }
  .ia-msg b { font-family: var(--ui); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .ia-msg.eu { align-self: flex-end; align-items: flex-end; text-align: right; }
  .ia-msg.eu div { background: var(--ink); color: var(--paper); padding: 8px 12px; border-radius: 12px; }
  .ia-msg.ia div { background: #fff; border: 1px solid var(--line); padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; }
  .ia-msg.erro div { background: #FDF3EC; border: 1px solid #F3D9C6; color: #7A4115; padding: 8px 12px; border-radius: 12px; }
  .ia-faixa code { background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 6px; font-size: 12px; }

    background: #fff; font: inherit; font-size: 13px; }

    border: 1px solid var(--line, #DDD); font: inherit; font-size: 14px; line-height: 1.5; resize: vertical; }

  /* 1.17.0 · quando a base responde, a barra é só uma linha discreta a dizer isso */
  .basebar {
    display: flex; align-items: center; gap: 8px;
    margin: var(--s3) var(--s4) 0; padding: 7px 12px;
    background: #EDF9F1; border: 1px solid #CBE9D5; border-radius: var(--r2, 12px);
    font-size: var(--t-xs, 12px); color: #1F5B37;
  }
  .basebar .dot { width: 7px; height: 7px; border-radius: 50%; background: #2E9E63; flex: none; }
  @media (max-width: 720px) { .basebar { margin: var(--s2) var(--s2) 0; } }
  .btn.quiet:hover { color: var(--ink); }

  .hint { color: var(--muted); font-size: var(--t-s); margin-top: var(--s3); }
  .hint.bad { color: var(--risk); }
  .empty { text-align: center; padding: var(--s6) var(--s5); }
  .empty .ic { width: 34px; height: 34px; color: var(--faint); margin-bottom: var(--s3); }
  .empty h3 { margin-bottom: var(--s2); }
  .empty p { color: var(--muted); max-width: 46ch; margin: 0 auto; }

  /* ---------- tabela de leads ---------- */
  .tools { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; margin-bottom: var(--s4); }
  .search {
    flex: 1; min-width: 220px; display: flex; align-items: center; gap: var(--s2);
    background: #fff; border: 1px solid var(--hair); border-radius: 999px; padding: 10px var(--s4);
  }
  .search input { border: 0; outline: none; width: 100%; background: transparent; font-size: var(--t-m); }
  .search .ic { color: var(--faint); width: 18px; height: 18px; flex: none; }
  .chip {
    min-height: 38px; padding: 0 16px; border-radius: 999px; font-size: 13.5px; font-weight: 550;
    background: #fff; border: 1px solid var(--hair); color: var(--muted);
    cursor: pointer; font-family: inherit;
    transition: background .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease);
  }
  .chip:hover { border-color: var(--hair-strong); color: var(--ink); }

  .rows { background: var(--card); border-radius: var(--r-l); overflow: hidden; box-shadow: var(--shadow); }
  .row {

  .row:hover { background: #FAFAFB; }
  .row .nm { font-weight: 600; letter-spacing: -.01em; }
  .row .mt { color: var(--muted); font-size: var(--t-s); margin-top: 1px; }
  .row .cell { color: var(--muted); font-size: var(--t-s); }
  .tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: var(--t-xs); font-weight: 600; background: #F1F1F3; color: var(--muted); }
  .tag.novo { background: var(--blue-soft); color: var(--blue); }
  .tag.contactado { background: var(--warn-soft); color: var(--warn); }
  .tag.respondeu, .tag.reuniao { background: var(--ok-soft); color: var(--ok); }
  .tag.cliente { background: #E7F0FF; color: #1B57C7; }
  .tag.perdido { background: var(--risk-soft); color: var(--risk); }

  /* =========================================================================
     1.59.0 · O CRM (2 nov 2026)

     O que estes estilos têm de dizer, e não é decoração:
       · a confiança e a verificação são etiquetas com a cor do estado e o
         motivo no `title` — quem quiser saber porquê, passa o rato;
       · na lista, a próxima ação fica debaixo do nome, na cor do atraso:
         um passo esquecido tem de se ver sem abrir a ficha;
       · os duplicados são cartões, não um aviso que se fecha e esquece.
     ========================================================================= */
  .crm-card .sec-h { gap: var(--s2); }
  .crm-card .stats { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--s2); margin-bottom: var(--s3); }
  .crm-fase { padding: var(--s3) var(--s3); border-radius: var(--r-m); box-shadow: none; border: 1px solid var(--hair); background: #FCFCFD; }
  .crm-fase b { font-size: 22px; }
  .crm-fase span { font-size: 11px; line-height: 1.25; }
  .crm-sinais { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--t-s); color: var(--muted); }
  .crm-sinal b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .crm-sinal.bad b { color: var(--risk); }
  .crm-chip {
    display: inline-flex; align-items: center; gap: 5px; margin-left: 6px;
    padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 650;
    color: color-mix(in srgb, var(--c, #8A8A8A) 85%, #151414);
    background: color-mix(in srgb, var(--c, #8A8A8A) 12%, #FFFFFF);
    border: 1px solid color-mix(in srgb, var(--c, #8A8A8A) 35%, transparent);
    white-space: nowrap;
  }
  .crm-chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c, #8A8A8A); }
  .crm-prox { font-size: 11.5px; margin-top: 2px; line-height: 1.35; }
  .row.crm { grid-template-columns: minmax(0, 1fr) 190px 128px 118px 92px; }
  .row.crm .cell { min-width: 0; overflow-wrap: anywhere; }
  .crm-prova table { width: 100%; border-collapse: collapse; }
  .crm-prova td { padding: 7px 0; border-bottom: 1px solid var(--hair); font-size: var(--t-s); vertical-align: top; }
  .crm-prova tr:last-child td { border-bottom: 0; }
  .crm-prova td:first-child { padding-right: var(--s4); }
  .crm-bar { height: 6px; border-radius: 999px; background: #EDEEF1; overflow: hidden; margin: 2px 0 var(--s3); }
  .crm-bar i { display: block; height: 100%; border-radius: 999px; }
  .crm-dup { margin-top: var(--s3); border: 1px solid var(--hair); border-radius: var(--r-m); overflow: hidden; }
  .crm-dup-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: var(--s3); background: #FCFCFD; border-bottom: 1px solid var(--hair); }
  .crm-dup-h span { color: var(--muted); font-size: 11.5px; }
  .crm-dup-g { padding: var(--s3); border-bottom: 1px solid var(--hair); }
  .crm-dup-g:last-child { border-bottom: 0; }
  .crm-dup-m { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .crm-dup-l { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s2); }
  .crm-dup-i {
    display: grid; gap: 1px; text-align: left; font: inherit; cursor: pointer;
    padding: var(--s2) var(--s3); border-radius: var(--r-m); border: 1px solid var(--hair);
    background: var(--card); transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .crm-dup-i:hover { border-color: var(--ink); box-shadow: var(--shadow); }
  .crm-dup-i:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .crm-dup-i b { font-size: var(--t-m); }
  .crm-dup-i span { font-size: 11.5px; color: var(--muted); }
  .crm-dup-i em { font-style: normal; font-size: 11px; color: var(--blue); }
  @media (max-width: 1080px) {
    .crm-card .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .row.crm { grid-template-columns: minmax(0, 1fr) 160px 110px 96px; }
    .row.crm .cell.crm-conf { display: none; }
  }
  @media (max-width: 820px) {
    .crm-card .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row.crm { grid-template-columns: minmax(0, 1fr) auto; }
    .row.crm .cell { display: none; }
    .row.crm .cell.tag-cell { display: block; }
  }

  /* ---------- projetos ---------- */
  .steps { list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s2); margin-bottom: var(--s2); }
  .steps li { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-m); padding: var(--s3); position: relative; }
  .steps li b { display: block; font-size: var(--t-s); font-weight: 620; }
  .steps li small { display: block; color: var(--faint); font-size: 11px; line-height: 1.3; margin-top: 2px; }
  .steps li.done { border-color: rgba(18,128,94,.35); background: linear-gradient(0deg, var(--ok-soft), var(--ok-soft)); }
  .steps li.done b { color: var(--ok); }
  .steps li.now { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .steps li.now b { color: var(--blue); }
  .steps li.bad { border-color: rgba(179,54,31,.35); background: var(--risk-soft); }
  .steps li.bad b { color: var(--risk); }
  .qa-head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s2); }
  .qa-list { list-style: none; display: grid; gap: var(--s2); margin-top: var(--s2); }
  .qa-list li { font-size: var(--t-s); color: var(--muted); border-left: 3px solid var(--hair); padding-left: var(--s3); line-height: 1.4; }
  .qa-list li.critico { border-color: var(--risk); }
  .qa-list li.importante { border-color: var(--warn); }
  .qa-list li.menor { border-color: var(--hair-strong); }
  .qa-list code { font-size: 11px; background: #F1F1F3; padding: 1px 5px; border-radius: 4px; color: var(--ink); }
  .feed { list-style: none; display: grid; gap: var(--s2); }
  .feed li { border-top: 1px solid var(--hair); padding-top: var(--s2); font-size: var(--t-s); }
  .feed li:first-child { border-top: 0; padding-top: 0; }
  @media (max-width: 820px) {
    .steps { grid-template-columns: 1fr 1fr; }
  }

  /* ---------- saldo ---------- */
  .cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
  .money { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); margin-bottom: var(--s5); }
  .money .card { padding: var(--s4) var(--s5); border-radius: var(--r-l); }
  .money b { display: block; font-size: 30px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .money small { color: var(--muted); font-size: var(--t-s); }
  .money b.ok { color: var(--ok); } .money b.bad { color: var(--risk); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 650; padding: 0 var(--s2) var(--s2); }
  td { padding: 10px var(--s2); border-top: 1px solid var(--hair); font-size: var(--t-m); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .form { display: grid; grid-template-columns: 140px 1fr auto; gap: var(--s2); margin-bottom: var(--s5); }
  .form.three { grid-template-columns: 1fr 1fr 1fr; }
  .form.two { grid-template-columns: 1fr 1fr auto; }
  /* 1.36.0 · campos com rótulo por cima (editar um lead): o rótulo é pequeno e
     discreto, o campo ocupa o espaço todo, e em ecrã estreito passa a uma coluna */
  .form.pares { grid-template-columns: 1fr 1fr; align-items: end; }
  .fld { display: grid; gap: 4px; }
  .fld > span { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  .fld .in { width: 100%; box-sizing: border-box; }
  .in {
    border: 1px solid var(--hair); background: #fff; border-radius: var(--r-s);
    padding: 11px var(--s3); font-size: var(--t-m); width: 100%;
    transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .in:hover { border-color: var(--hair-strong); }
  .in:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(21,94,239,.14); }
  .in[aria-invalid="true"] { border-color: var(--risk); box-shadow: 0 0 0 3px rgba(180,35,24,.12); }

  /* ---------- estados, avisos, barra inferior ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: #1B1B1F; color: #fff; padding: 13px var(--s5); border-radius: 999px;
    font-size: var(--t-s); box-shadow: 0 16px 40px rgba(0,0,0,.22);
    opacity: 0; pointer-events: none; transition: opacity .22s var(--ease), transform .22s var(--ease); z-index: 60;
    max-width: min(560px, 90vw); text-align: center;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--risk); }
  .tabbar { display: none; }
  /* o X do telemóvel: 44 px de alvo, no canto, sempre por cima do conteúdo */
  .m-x { display: none; }
  @media (max-width: 820px) {
    .m-x {
      display: inline-flex; position: fixed; top: 10px; right: 10px; z-index: 60;
      width: 44px; height: 44px; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255,255,255,.96); color: var(--ink);
      border: 1px solid var(--hair); box-shadow: 0 1px 2px rgba(20,20,24,.06);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .m-x svg { width: 17px; height: 17px; }
    .m-x:active { background: #F2F2F0; }

    main { padding-top: calc(var(--s5) + 34px); }
  }
  .skeleton { color: var(--faint); padding: var(--s6); text-align: center; }

  @media (max-width: 1080px) {
    .split { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 1fr 110px 92px; }
    .row .cell.hide-m { display: none; }
  }
  @media (max-width: 820px) {
    .side { display: none; }
    main { padding: var(--s5) var(--s4) 96px; }
    .head { flex-direction: column; gap: var(--s3); }
    .head h1 { font-size: 32px; }
    .stats { gap: var(--s2); }
    .stat { padding: var(--s3) var(--s4); border-radius: var(--r-m); }
    .stat b { font-size: 26px; }
    .card { padding: var(--s4); border-radius: var(--r-l); }
    .detail-top h3 { font-size: 24px; }
    .bubble { font-size: var(--t-m); }
    .why-grid { grid-template-columns: 1fr; }
    .money { grid-template-columns: 1fr; }
    .cards2 { grid-template-columns: 1fr; }
    .form, .form.three, .form.two, .form.pares { grid-template-columns: 1fr; }
    .acts { position: sticky; bottom: 84px; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: var(--s2) 0; }
    .tabbar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
      border-top: 1px solid var(--hair); padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }
    .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); padding: 4px 0; border-radius: var(--r-s); }
    .tabbar a.on { color: var(--blue); font-weight: 600; }
    .tabbar .ic { width: 22px; height: 22px; }
    .row { grid-template-columns: 1fr auto; padding: var(--s3) var(--s4); }
    .row .cell, .row .cell.hide-m { display: none; }
    .toast { bottom: 96px; }
  }
  /* =========================================================================
     1.48.0 · O CINE — a direcção visual do estúdio

     Isto não é «mais uma página». A regra que segui, e que dá o resto:
       1 · uma cor de acento por ecrã, e o preto é uma cor (o hero é cinema);
       2 · tipografia grande com muito espaço: o nome da lead manda;
       3 · hierarquia por peso e espaço, não por caixas e riscos;
       4 · o movimento explica o que aconteceu (a gerar → aparece), nunca decora;
       5 · nada de sombras pesadas: uma luz por cartão, vinda de cima.
     ========================================================================= */
  .wrap.cine { max-width: 1120px; }
  .cine { --cine-escuro: #0B0B0F; --cine-luz: #F7F7FA; --cine-fio: rgba(255,255,255,.12); }

  /* ---------- o hero: preto profundo, uma luz que respira ---------- */
  .cine-hero {
    position: relative; overflow: hidden; isolation: isolate;
    border-radius: 28px; padding: clamp(24px, 4vw, 44px);
    background: radial-gradient(120% 140% at 12% -10%, #1E2340 0%, #0B0B0F 55%, #08080B 100%);
    color: #fff; margin-bottom: var(--s5);
    box-shadow: 0 30px 80px -40px rgba(11,11,15,.65);
  }
  .cine-hero.pequeno { padding: clamp(22px, 3vw, 34px); }
  .cine-hero-luz {
    position: absolute; inset: -40% -10% auto auto; width: 62%; aspect-ratio: 1;
    background: radial-gradient(circle, rgba(88,120,255,.55), rgba(88,120,255,0) 62%);
    filter: blur(6px); z-index: -1; animation: cine-respira 9s var(--ease) infinite alternate;
  }
  @keyframes cine-respira { from { transform: translate3d(0,0,0) scale(1); opacity: .75; } to { transform: translate3d(-4%,6%,0) scale(1.12); opacity: 1; } }
  .cine-hero-topo { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s5); }
  .cine-voltar { font-size: var(--t-s); color: rgba(255,255,255,.62); transition: color .2s var(--ease); }
  .cine-voltar:hover { color: #fff; }
  .cine-hero h1 {
    font-size: clamp(30px, 5vw, 54px); line-height: 1.02; letter-spacing: -.035em;
    font-weight: 640; margin: 0 0 var(--s2);
  }
  .cine-sub { color: rgba(255,255,255,.66); font-size: var(--t-m); max-width: 58ch; letter-spacing: -.005em; }
  .cine-selo {
    display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs);
    letter-spacing: .02em; text-transform: none; padding: 6px 12px; border-radius: 999px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16); color: #EDEDF5;
    backdrop-filter: blur(10px); white-space: nowrap;
  }
  .cine-selo.ia { background: rgba(96,128,255,.22); border-color: rgba(128,152,255,.45); color: #DCE3FF; }
  .cine-selo.regra { background: rgba(255,190,90,.14); border-color: rgba(255,190,90,.34); color: #FFE0AE; }
  .cine-selo.ok { background: rgba(70,200,150,.16); border-color: rgba(70,200,150,.4); color: #B8F0D8; }
  .cine-card .cine-selo { background: var(--blue-soft); border-color: transparent; color: var(--blue); }

  /* ---------- os passos: uma linha, quatro pontos ---------- */
  .cine-passos {
    display: flex; gap: clamp(10px, 3vw, 26px); list-style: none; margin: var(--s5) 0 0;
    padding: 0; flex-wrap: wrap;
  }
  .cine-passos li { display: flex; align-items: center; gap: 8px; font-size: var(--t-s); color: rgba(255,255,255,.5); transition: color .3s var(--ease); }
  .cine-passos li.feito, .cine-passos li.agora { color: rgba(255,255,255,.92); }
  .cine-ponto {
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font-size: 11px; border: 1px solid rgba(255,255,255,.24); color: rgba(255,255,255,.7);
    transition: background .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
  }
  .cine-passos li.feito .cine-ponto { background: rgba(70,200,150,.9); border-color: transparent; color: #04120C; }
  .cine-passos li.agora .cine-ponto { border-color: #7B93FF; box-shadow: 0 0 0 4px rgba(123,147,255,.16); transform: scale(1.05); }

  /* ---------- cartões ---------- */
  .cine-card {
    background: var(--card); border-radius: 22px; padding: clamp(18px, 2.6vw, 30px);
    box-shadow: 0 1px 0 var(--hair), 0 18px 44px -34px rgba(27,27,31,.5);
    margin-bottom: var(--s4); border: 1px solid rgba(27,27,31,.045);
    animation: cine-entra .5s var(--ease) both;
  }
  @keyframes cine-entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .cine-card-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); flex-wrap: wrap; }
  .cine-card h2 { font-size: var(--t-l); letter-spacing: -.02em; font-weight: 620; }
  .cine-card h3 { font-size: var(--t-s); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: var(--s4) 0 var(--s2); font-weight: 600; }
  .cine-min { color: var(--faint); font-size: var(--t-xs); letter-spacing: .01em; }
  .cine-leitura { font-size: var(--t-m); line-height: 1.6; color: var(--ink); max-width: 68ch; }

  .cine-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s2); }
  .cine-chip {
    font-size: var(--t-xs); padding: 4px 10px; border-radius: 999px;
    background: rgba(27,27,31,.05); color: var(--muted); border: 1px solid transparent;
  }
  .cine-chip.bom { background: var(--ok-soft); color: var(--ok); }
  .cine-chip.falta { background: var(--warn-soft); color: var(--warn); }

  /* ---------- as secções do Master Prompt: uma lista de definições limpa ---------- */
  .cine-seccoes { display: grid; gap: var(--s3); margin: 0; }
  .cine-seccoes > div { display: grid; grid-template-columns: 168px 1fr; gap: var(--s3); align-items: baseline; }
  .cine-seccoes dt { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); font-weight: 600; }
  .cine-seccoes dd { margin: 0; font-size: var(--t-m); line-height: 1.55; }
  @media (max-width: 720px) { .cine-seccoes > div { grid-template-columns: 1fr; gap: 2px; } }
  .cine-restricoes ul { list-style: none; display: grid; gap: 6px; }
  .cine-restricoes li { font-size: var(--t-s); color: var(--muted); padding-left: 18px; position: relative; }
  .cine-restricoes li::before { content: '—'; position: absolute; left: 0; color: var(--faint); }
  .cine-pre {
    margin-top: var(--s4); padding: var(--s4); border-radius: 14px; background: #0B0B0F; color: #D8DCEA;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.6;
    white-space: pre-wrap; overflow-x: auto;
  }

  /* ---------- controlos ---------- */
  .cine-fld { display: flex; flex-direction: column; gap: 6px; margin-top: var(--s3); }
  .cine-fld > span { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 600; }
  .cine-in {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--hair-strong);
    background: #FCFCFD; font-size: var(--t-m); transition: border-color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
  }
  .cine-in:focus { outline: none; border-color: rgba(43,59,242,.45); background: #fff; box-shadow: 0 0 0 4px rgba(43,59,242,.08); }
  .cine-in.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.55; }
  .cine-duo { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
  @media (max-width: 640px) { .cine-duo { grid-template-columns: 1fr; } }
  .cine-grupo { margin-top: var(--s4); }
  .cine-rotulo { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 600; display: block; margin-bottom: 8px; }
  .cine-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .cine-pill {
    padding: 8px 14px; border-radius: 999px; font-size: var(--t-s); color: var(--muted);
    border: 1px solid var(--hair-strong); background: #fff;
    transition: all .22s var(--ease); transform: translateZ(0);
  }
  .cine-pill:hover { border-color: rgba(43,59,242,.35); color: var(--ink); transform: translateY(-1px); }
  .cine-pill.on { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 10px 24px -14px rgba(43,59,242,.9); }

  .cine-acts { display: flex; gap: var(--s2); margin-top: var(--s4); flex-wrap: wrap; align-items: center; }
  .cine-acts-min { display: inline-flex; gap: var(--s3); align-items: center; }
  .cine-btn {
    padding: 12px 20px; border-radius: 999px; font-size: var(--t-s); font-weight: 560;
    background: #fff; border: 1px solid var(--hair-strong); color: var(--ink);
    transition: transform .18s var(--ease), box-shadow .22s var(--ease), background .18s var(--ease), opacity .2s var(--ease);
  }
  .cine-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 26px -20px rgba(27,27,31,.7); }
  .cine-btn.primario { background: #0B0B0F; color: #fff; border-color: transparent; }
  .cine-btn.primario:hover { background: #16161D; }
  .cine-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .cine-link { font-size: var(--t-s); color: var(--blue); padding: 4px 2px; border-radius: 8px; transition: opacity .2s var(--ease); }
  .cine-link:hover { opacity: .7; }
  .cine-link.perigo { color: var(--risk); }

  /* ---------- o esqueleto: a imagem a nascer, não uma imagem falsa ---------- */
  .cine-skeleton {
    aspect-ratio: 16 / 10; border-radius: 16px; width: 100%;
    background: linear-gradient(100deg, #EEEEF2 20%, #F7F7FA 40%, #EEEEF2 60%);
    background-size: 220% 100%; animation: cine-brilho 1.4s linear infinite;
  }
  .cine-skeleton.alto { aspect-ratio: 21 / 6; margin-top: var(--s4); }
  @keyframes cine-brilho { from { background-position: 120% 0; } to { background-position: -120% 0; } }

  /* ---------- a galeria ---------- */
  .cine-galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--s3); margin-top: var(--s3); }
  .cine-fig { margin: 0; border-radius: 18px; overflow: hidden; background: #F4F4F7; position: relative; }
  .cine-fig img { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; transition: transform .6s var(--ease); }
  .cine-fig:hover img { transform: scale(1.035); }
  /* 1.53.2 · o vídeo composto: leitor com cantos redondos e a mesma linguagem das peças */
  .cine-fig-video { margin: 0 0 var(--s2); border-radius: 18px; overflow: hidden; background: #0b0d10; }
  .cine-fig-video video { width: 100%; display: block; aspect-ratio: 16 / 9; background: #0b0d10; }
  .cine-fig-video figcaption { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); padding: 10px 14px; background: #F4F4F7; }
  .cine-fig.aprovada { outline: 2px solid rgba(18,128,94,.55); outline-offset: 2px; }
  .cine-fig figcaption { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: #fff; flex-wrap: wrap; }
  .cine-sem-bytes { aspect-ratio: 4 / 3; display: grid; place-content: center; gap: 4px; text-align: center; color: var(--faint); font-size: var(--t-xs); padding: var(--s3); }

  /* ---------- a tabela dos modelos de vídeo ---------- */
  .cine-tabela { display: grid; gap: 2px; margin-top: var(--s3); border-radius: 14px; overflow: hidden; }
  .cine-linha { display: grid; grid-template-columns: 170px 1fr auto; gap: var(--s3); padding: 12px 14px; background: #FAFAFC; font-size: var(--t-s); align-items: baseline; }
  .cine-linha b { font-weight: 600; }
  .cine-linha span { color: var(--muted); }
  @media (max-width: 640px) { .cine-linha { grid-template-columns: 1fr; gap: 2px; } }

  /* ---------- histórico ---------- */
  .cine-tempo { list-style: none; display: grid; gap: 10px; }
  .cine-tempo li { font-size: var(--t-s); color: var(--ink); display: flex; gap: 10px; align-items: baseline; }
  .cine-tempo li .cine-min { font-variant-numeric: tabular-nums; }

  /* ---------- lista de projectos ---------- */
  .cine-grelha { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s4); }
  .cine-mini {
    display: flex; flex-direction: column; background: var(--card); border-radius: 20px; overflow: hidden;
    border: 1px solid rgba(27,27,31,.05); box-shadow: 0 18px 44px -38px rgba(27,27,31,.6);
    transition: transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .cine-mini:hover { transform: translateY(-3px); box-shadow: 0 30px 60px -40px rgba(27,27,31,.7); }
  .cine-mini img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
  .cine-mini-vazio { aspect-ratio: 16 / 10; display: grid; place-items: center; background: linear-gradient(135deg, #0B0B0F, #1B2140); color: rgba(255,255,255,.5); font-size: var(--t-xs); }
  .cine-mini-txt { padding: var(--s4); display: grid; gap: 4px; }
  .cine-mini-txt b { font-size: var(--t-m); letter-spacing: -.01em; font-weight: 600; }
  .cine-conceito { font-size: var(--t-s); color: var(--muted); line-height: 1.5; }

  .cine-alerta {
    margin-top: var(--s3); padding: 12px 14px; border-radius: 12px; font-size: var(--t-s);
    background: var(--risk-soft); color: var(--risk); border: 1px solid rgba(179,54,31,.16);
  }
  .cine-alerta.suave { background: var(--warn-soft); color: var(--warn); border-color: rgba(161,106,0,.16); }
  .cine-vazio { text-align: center; display: grid; gap: var(--s3); justify-items: center; }
  .cine-vazio p { color: var(--muted); max-width: 52ch; }

  /* ==========================================================================
     1.54.2 · O BRIEFING DO PROJETO
     Três abas dentro do cartão do projeto. A mesma linguagem do resto da mesa:
     cartões brancos, um azul para a acção principal, etiquetas para a origem de
     cada campo. Nada de ecrãs de apresentação.
     ======================================================================= */
  .bf-card { margin-top: var(--s4); }
  .bf-cabeca { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); flex-wrap: wrap; }
  .bf-sobre { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); font-weight: 600; }
  .bf-cabeca h3 { font-size: var(--t-l); letter-spacing: -.02em; margin-top: 2px; }
  .bf-min { color: var(--muted); font-size: var(--t-s); margin-top: 2px; }

  .bf-abas { display: flex; gap: 4px; background: #F4F4F7; padding: 4px; border-radius: 999px; margin-bottom: var(--s4); flex-wrap: wrap; }
  .bf-aba {
    padding: 9px 18px; border-radius: 999px; font-size: var(--t-s); font-weight: 560; color: var(--muted);
    background: transparent; transition: background .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease);
  }
  .bf-aba:hover { color: var(--ink); }
  .bf-aba.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(27,27,31,.10), 0 6px 18px -14px rgba(27,27,31,.6); }

  .bf-barra { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s3); }
  .bf-contas { display: flex; gap: var(--s4); flex-wrap: wrap; color: var(--muted); font-size: var(--t-s); }
  .bf-contas b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bf-estado { display: flex; gap: 6px; align-items: center; }

  .bf-campos { display: grid; gap: var(--s3); }
  .bf-campo { display: grid; gap: 5px; }
  .bf-campo-h { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }
  .bf-campo-h label { font-size: var(--t-s); font-weight: 600; letter-spacing: -.01em; }
  .bf-ajuda { font-size: var(--t-xs); color: var(--faint); }
  .bf-in { resize: vertical; min-height: 42px; line-height: 1.5; font-family: inherit; }
  .bf-in.vazio { background: #FCFCFD; border-style: dashed; }
  .bf-in:focus-visible { outline: 2px solid rgba(43,59,242,.45); outline-offset: 1px; }
  .bf-badge.lead { background: var(--blue-soft); color: var(--blue); }
  .bf-badge.ia { background: var(--warn-soft); color: var(--warn); }
  .bf-badge.manual { background: var(--ok-soft); color: var(--ok); }
  .bf-badge.vazio { background: #F1F1F3; color: var(--faint); }
  .bf-acts { flex-wrap: wrap; align-items: center; }

  .bf-aviso {
    margin: 0 0 var(--s4); padding: 12px 14px; border-radius: 12px; font-size: var(--t-s);
    background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(161,106,0,.16);
    display: grid; gap: 4px;
  }
  .bf-aviso b { font-weight: 620; }
  .bf-aviso.mau { background: var(--risk-soft); color: var(--risk); border-color: rgba(179,54,31,.16); }

  .bf-pre {
    margin: var(--s3) 0 0; padding: var(--s4); border-radius: 14px; background: #0B0B0F; color: #D8DCEA;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.62;
    white-space: pre-wrap; overflow-x: auto; max-height: 520px; overflow-y: auto;
  }
  .bf-pre-pequeno { font-size: 12px; max-height: 260px; background: #F7F7FA; color: var(--ink); }

  .bf-vazio { display: grid; gap: var(--s3); justify-items: start; }
  .bf-vazio h3 { font-size: var(--t-m); font-weight: 620; }
  .bf-vazio p { color: var(--muted); max-width: 64ch; }

  .bf-prompts { display: grid; gap: var(--s4); margin-top: var(--s3); }
  .bf-prompt { border: 1px solid var(--hair); border-radius: 16px; padding: var(--s4); background: #fff; }
  .bf-prompt header { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); flex-wrap: wrap; }
  .bf-prompt h4 { font-size: var(--t-m); font-weight: 620; letter-spacing: -.01em; }
  .bf-dl { display: grid; gap: 6px; margin-top: var(--s3); }
  .bf-dl > div { display: grid; grid-template-columns: 132px 1fr; gap: var(--s3); align-items: baseline; }
  .bf-dl dt { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 600; }
  .bf-dl dd { margin: 0; font-size: var(--t-s); line-height: 1.55; }
  .bf-nota { margin-top: var(--s3); font-size: var(--t-xs); color: var(--warn); background: var(--warn-soft); padding: 8px 10px; border-radius: 10px; }

  .bf-versoes { margin-top: var(--s4); display: grid; gap: var(--s2); }
  .bf-versoes h4 { font-size: var(--t-s); text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 600; }
  .bf-versao { background: #FAFAFC; border-radius: 12px; padding: 10px 12px; }
  .bf-versao summary { cursor: pointer; font-size: var(--t-s); }

  @media (max-width: 640px) {
    .bf-dl > div { grid-template-columns: 1fr; gap: 2px; }
    .bf-contas { gap: var(--s2) var(--s3); }
    .bf-aba { padding: 8px 14px; }
    .bf-pre { max-height: 320px; }
  }

  /* ------------------------------------------------------------------
     1.54.3 · A MÍDIA DO PROJETO — gerar imagem e vídeo, com o custo à vista
     ------------------------------------------------------------------ */
  .md-card { margin-top: var(--s4); }
  .md-cabeca { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
  .md-sobre { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 600; }
  .md-cabeca h3 { font-size: 22px; margin: 4px 0 2px; letter-spacing: -.01em; }
  .md-min { font-size: var(--t-s); color: var(--faint); }
  .md-min a { text-decoration: underline; }

  .md-aviso { margin-top: var(--s3); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; font-size: var(--t-s);
    background: #F6F7F9; border-radius: 12px; padding: 10px 12px; color: var(--ink-soft); }
  .md-aviso b { color: var(--ink); }
  .md-aviso.mau { background: var(--bad-soft, #FDECEC); color: #7A1C1C; }
  .md-ia { margin-top: var(--s3); font-size: var(--t-s); color: var(--faint); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag.md-tag-ia { background: #EFE9FB; color: #4B2E83; }

  .md-form { margin-top: var(--s4); display: grid; gap: var(--s2); }
  .md-tipos { display: inline-flex; gap: 4px; background: #F1F2F5; padding: 4px; border-radius: 12px; width: fit-content; }
  .md-tipo { border: 0; background: transparent; font: inherit; font-size: var(--t-s); font-weight: 600; padding: 7px 16px;
    border-radius: 9px; cursor: pointer; color: var(--ink-soft); }
  .md-tipo.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(16,18,22,.10), 0 0 0 1px rgba(16,18,22,.04); }
  .md-lab { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; margin-top: var(--s2); }
  .md-sel, .md-area { font: inherit; font-size: var(--t-s); color: var(--ink); background: #fff; border: 1px solid var(--line, #E4E6EB);
    border-radius: 12px; padding: 10px 12px; width: 100%; }
  .md-area { resize: vertical; min-height: 96px; line-height: 1.5; }
  .md-opcoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--s3); }

  .md-custo { margin-top: var(--s3); border-radius: 14px; padding: 12px 14px; background: #F4F8F4; border: 1px solid #DCEBDE; }
  .md-custo.incerto { background: #FFF6E8; border-color: #F2DFBB; }
  .md-custo-t { font-weight: 600; font-size: var(--t-m); letter-spacing: -.01em; }
  .md-custo-n { font-size: var(--t-s); color: var(--ink-soft); margin-top: 2px; }
  .md-custo-f { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .md-custo-f span { font-size: var(--t-xs); background: rgba(16,18,22,.05); border-radius: 999px; padding: 3px 9px; color: var(--ink-soft); }
  .md-acts { flex-wrap: wrap; }

  .md-curso { margin-top: var(--s4); display: grid; gap: 6px; }
  .md-curso-linha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #F7F8FA; border-radius: 12px; padding: 8px 10px; }
  .md-curso-t { font-size: var(--t-s); color: var(--ink-soft); flex: 1; min-width: 160px; }
  .md-pct { font-variant-numeric: tabular-nums; font-size: var(--t-s); color: var(--ink); font-weight: 600; }

  .md-galeria { margin-top: var(--s4); display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s3); }
  .md-item { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line, #E4E6EB); border-radius: 16px; overflow: hidden; }
  .md-item.mau { border-color: #EFD2D2; }
  /* a caixa segue a proporção do ficheiro: uma imagem 4:5 não é cortada a 4:3,
     e um vídeo 16:9 não aparece com barras — `contain` mostra o ficheiro todo */
  .md-fig-caixa { background: #0B0D10; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; }
  .md-fig-caixa.retrato { aspect-ratio: 4 / 5; }
  .md-fig-caixa.quadrado { aspect-ratio: 1 / 1; }
  .md-fig { width: 100%; height: 100%; object-fit: contain; display: block; }
  .md-fig-vazio { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,.55); font-size: var(--t-s); letter-spacing: .06em; text-transform: uppercase; }
  .md-item-corpo { padding: 12px 14px 14px; display: grid; gap: 8px; }
  .md-item-topo { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .md-item-tipo { font-size: var(--t-xs); color: var(--faint); text-transform: uppercase; letter-spacing: .07em; }
  .md-item-p { margin: 0; font-size: var(--t-s); color: var(--ink-soft); line-height: 1.45; }
  .md-item-sub { font-size: var(--t-xs); color: var(--faint); }
  .md-item-acts { flex-wrap: wrap; gap: 6px; }
  .md-erro { font-size: var(--t-s); color: #7A1C1C; background: #FDECEC; border-radius: 10px; padding: 8px 10px; }
  .md-det { margin: 4px 0 0; font-size: var(--t-xs); display: grid; gap: 6px; }
  .md-det > div { display: grid; grid-template-columns: 110px 1fr; gap: 8px; }
  .md-det dt { color: var(--faint); text-transform: uppercase; letter-spacing: .06em; font-size: 10px; padding-top: 2px; }
  .md-det dd { margin: 0; color: var(--ink-soft); word-break: break-word; }
  .md-vazio { margin-top: var(--s4); background: #FAFAFC; border-radius: 14px; padding: 18px; display: grid; gap: 4px; }
  .md-vazio b { font-size: var(--t-m); }
  .md-vazio span { font-size: var(--t-s); color: var(--ink-soft); }

  .tag.md-tag-espera { background: #EEF1F6; color: #33445C; }
  .tag.md-tag-corre { background: #FFF3DA; color: #7A5200; }
  .tag.md-tag-ok { background: #E7F5EA; color: #1F6B33; }
  .tag.md-tag-mau { background: #FDECEC; color: #7A1C1C; }
  .tag.md-tag-quiet { background: #F1F2F5; color: var(--ink-soft); }
  .tag.md-class-conceito { background: #EFE9FB; color: #4B2E83; }
  .tag.md-class-aprovado { background: #E7F5EA; color: #1F6B33; }

  @media (max-width: 640px) {
    /* no telemóvel o dedo não é um rato: 44 px é o mínimo recomendado */
    .md-tipo { min-height: 44px; }
    .md-item-acts .btn, .md-acts .btn, .md-curso .btn { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
    .md-sel, .md-area { font-size: 16px; } /* 16px evita o zoom automático do iOS ao focar */
    .md-galeria { grid-template-columns: 1fr; }
    .md-opcoes { grid-template-columns: 1fr; }
    .md-tipos { width: 100%; }
    .md-tipo { flex: 1; }
    .md-acts .btn { flex: 1 1 auto; }
    .md-det > div { grid-template-columns: 1fr; gap: 2px; }
  }


  /* =========================================================================
     1.57.0 · A PÁGINA DO PROJETO
     Caminho, cabeçalho, quatro abas e duas colunas. A coluna da esquerda é o
     trabalho (o formulário); a da direita é o acompanhamento (progresso e
     lead), mais estreita e visualmente secundária — para não competir com o que
     se está a escrever.
     ========================================================================= */
  /* o cartão do fundo da barra lateral — números reais do consumo */
  .plan {
    border: 1px solid var(--hair); border-radius: var(--r-m); padding: 12px;
    background: #FCFCFD; display: grid; gap: 2px;
  }
  .plan-t { font-size: 12px; color: var(--muted); font-weight: 550; }
  .plan-v { font-size: 19px; font-weight: 680; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .plan-s { font-size: 11.5px; color: var(--faint); line-height: 1.4; }
  .plan-b {
    margin-top: 8px; display: inline-flex; align-items: center; justify-content: space-between;
    gap: 6px; height: 34px; padding: 0 10px; border-radius: 8px; background: #fff;
    border: 1px solid var(--hair-strong); font-size: 12.5px; font-weight: 600; color: var(--ink);
  }
  .plan-b:hover { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
  .plan-b .chev { width: 14px; height: 14px; }

  .pj { max-width: 1180px; }
  .pj-crumbs { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); margin-bottom: 14px; }
  .pj-crumbs a { color: var(--muted); }
  .pj-crumbs a:hover { color: var(--blue); }
  .pj-crumbs span[aria-current] { color: var(--ink); font-weight: 550; }

  .pj-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  .pj-id { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .pj-ic {
    width: 56px; height: 56px; flex: none; border-radius: 14px;
    background: var(--blue-soft); color: var(--blue);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 19px; font-weight: 700; letter-spacing: -.01em;
  }
  .pj-id-t { min-width: 0; }
  .pj-id h1 { font-size: 34px; font-weight: 680; letter-spacing: -.03em; line-height: 1.12; }
  .pj-sub { margin-top: 3px; font-size: 16px; color: var(--muted); }
  .pj-head-acts { display: flex; align-items: center; gap: 10px; flex: none; }
  .pj-status { padding: 6px 12px; font-size: 13px; }
  .pj-status::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: middle; }

  .pj-menu { position: relative; }
  .pj-menu summary { list-style: none; }
  .pj-menu summary::-webkit-details-marker { display: none; }
  .pj-menu-b {
    width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--hair);
    background: #fff; color: var(--muted); display: inline-flex; align-items: center;
    justify-content: center; font-size: 20px; line-height: 1; cursor: pointer;
  }
  .pj-menu-b:hover { background: #F8FAFC; color: var(--ink); }
  .pj-menu-l {
    position: absolute; right: 0; top: 46px; z-index: 35; min-width: 200px;
    background: #fff; border: 1px solid var(--hair); border-radius: var(--r-m);
    box-shadow: 0 12px 32px -18px rgba(16,24,40,.4); padding: 6px;
  }
  .pj-menu-l a, .pj-menu-l button, .pj-menu-i {
    display: block; width: 100%; padding: 10px 12px; border-radius: 8px;
    font-size: 14px; text-align: left; background: none; border: 0; cursor: pointer; font-family: inherit; color: var(--ink);
  }
  .pj-menu-l a:focus-visible, .pj-menu-l button:focus-visible, .pj-menu-i:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .pj-menu-l a:hover, .pj-menu-l button:hover { background: #F8FAFC; }

  .pj-tabs-bar { border-bottom: 1px solid var(--hair); margin-bottom: 24px; }
  .pj-tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .pj-tabs::-webkit-scrollbar { display: none; }
  .pj-tab {
    position: relative; display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 14px 14px; font-size: 14.5px; font-weight: 550; color: var(--muted);
    white-space: nowrap; border-radius: 8px 8px 0 0;
    transition: color .16s var(--ease), background .16s var(--ease);
  }
  .pj-tab .ic { width: 18px; height: 18px; }
  .pj-tab:hover { color: var(--ink); background: #F8FAFC; }
  .pj-tab.on { color: var(--blue); }
  .pj-tab.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--blue); border-radius: 2px 2px 0 0; }

  .pj-grid { display: grid; grid-template-columns: minmax(0, 1fr) 336px; gap: 24px; align-items: start; }
  .pj-main { min-width: 0; }
  .pj-aside { display: grid; gap: 16px; position: sticky; top: calc(var(--head) + 16px); }

  .pj-panel { padding: 20px; }
  .pj-panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .pj-panel-h h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  .pj-pct { font-size: 14px; font-weight: 650; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pj-bar { height: 6px; border-radius: 999px; background: #EEF1F6; overflow: hidden; }
  .pj-bar i { display: block; height: 100%; background: var(--blue); border-radius: 999px; transition: width .4s var(--ease); }

  .pj-steps { list-style: none; display: grid; gap: 2px; margin-top: 16px; }
  .pj-step { display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; padding: 7px 0; font-size: 13.5px; }
  .pj-dot {
    width: 18px; height: 18px; border-radius: 50%; border: 1.6px solid var(--hair-strong);
    display: inline-flex; align-items: center; justify-content: center; color: #fff;
  }
  .pj-dot svg { width: 11px; height: 11px; }
  .pj-step.feito .pj-dot { background: var(--ok); border-color: var(--ok); }
  .pj-step.activo .pj-dot { border-color: var(--blue); background: #fff; box-shadow: inset 0 0 0 4px var(--blue-soft); }
  .pj-step-nm { color: var(--ink); }
  .pj-step-st { color: var(--faint); font-size: 12.5px; text-align: right; }
  .pj-step.feito .pj-step-st { color: var(--ok); }
  .pj-step.activo .pj-step-nm { font-weight: 600; }
  .pj-step.activo .pj-step-st { color: var(--blue); }
  .pj-note { margin-top: 14px; font-size: 12px; color: var(--faint); line-height: 1.5; }

  .pj-copy {
    width: 36px; height: 36px; border-radius: 9px; color: var(--muted); background: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .16s var(--ease), color .16s var(--ease);
  }
  .pj-copy:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .pj-copy:hover { background: #F2F4F7; color: var(--ink); }
  .pj-copy .ic { width: 16px; height: 16px; }
  .pj-lead { display: grid; gap: 0; }
  .pj-lead-row { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid #F1F3F7; font-size: 13.5px; }
  .pj-lead-row:last-child { border-bottom: 0; }
  .pj-lead-row dt { color: var(--muted); }
  .pj-lead-row dd { color: var(--ink); text-align: right; overflow-wrap: anywhere; }
  .pj-lead-row dd a:hover { color: var(--blue); }
  .pj-lead-link { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--blue); font-weight: 550; }
  .pj-lead-link:hover { text-decoration: underline; }

  /* ---------- o formulário do briefing, na coluna principal ---------- */
  .pj-main > .bf-card:first-child { margin-top: 0; }
  .bf-cabeca-sec { align-items: flex-start; }
  .bf-cabeca-sec h3 { font-size: 20px; font-weight: 680; letter-spacing: -.02em; }
  .bf-cabeca-sec .bf-min { font-size: 14px; color: var(--muted); margin-top: 4px; max-width: 62ch; }
  .bf-campos { gap: 18px; }
  .bf-campo-h label { font-size: 13.5px; font-weight: 600; }
  .bf-in { min-height: 44px; padding: 11px 12px; font-size: 14.5px; }
  .bf-in.vazio { background: #FCFCFD; }
  .bf-in:focus, .bf-in:focus-visible { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(21,94,239,.14); }
  .bf-badge { font-size: 11.5px; font-weight: 600; padding: 3px 8px; }
  .bf-badge.lead { background: #EFF2F6; color: #475467; }
  .bf-badge.ia { background: var(--ok-soft); color: var(--ok); }
  .bf-badge.manual { background: #F4F5F7; color: var(--muted); }
  .bf-acts { justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--hair); }
  .bf-acts .btn { flex: none; }
  .bf-barra { padding-bottom: 12px; border-bottom: 1px solid #F1F3F7; margin-bottom: 18px; }
  .bf-aba:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  @media (max-width: 1180px) {
    .pj-grid { grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; }
  }
  @media (max-width: 1024px) {
    .pj-grid { grid-template-columns: 1fr; }
    .pj-aside { position: static; grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 820px) {
    /* no telemóvel os botões crescem em vez de encolher: 48 px de altura e
       largura toda quando estão num rodapé de acções */
    .btn { --btn-h: 48px; font-size: 15px; padding: 0 18px; }
    .btn.small { --btn-h: 42px; font-size: 13.5px; }
    .acts { gap: 8px; }
    .acts > .btn { flex: 1 1 auto; }
    /* o X de sair da mesa (fixo no canto) não pode tapar a conta: o cabeçalho
       deixa-lhe 58 px à direita */
    .app-head { height: 64px; padding: 0 58px 0 12px; gap: 8px; }
    .hsearch input { height: 38px; padding-right: 14px; }
    .hsearch kbd { display: none; }
    .huser .who { display: none; }
    .pj-head { flex-direction: column; align-items: flex-start; gap: 12px; }
    .pj-id h1 { font-size: 26px; }
    .pj-ic { width: 46px; height: 46px; border-radius: 12px; font-size: 16px; }
    .pj-sub { font-size: 14.5px; }
    .pj-aside { grid-template-columns: 1fr; }
    .pj-tabs { gap: 0; }
    .pj-tab { padding: 11px 12px 13px; font-size: 14px; }
    .pj-panel { padding: 16px; }
    .bf-acts { flex-wrap: wrap; }
    .bf-acts .btn { flex: 1 1 auto; }
  }


  /* =========================================================================
     1.57.2 · O CENTRO DE COMANDO (a visão geral)
     Quatro números no topo, a fila de aprovações à esquerda, as salas e o que
     está preso à direita. Nada de gradientes: cartões brancos, uma borda de
     1 px, sombra de 1 px. A cor só distingue estado — azul a acontecer, verde
     concluído, âmbar à espera de ti, vermelho bloqueado.
     ========================================================================= */
  .cc { max-width: 1240px; }
  .cc-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 22px; }
  .cc-kpi {
    background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-l);
    padding: 16px 18px 14px; box-shadow: 0 1px 2px rgba(16,24,40,.04);
    display: flex; flex-direction: column; min-height: 132px;
  }
  .cc-kpi-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cc-kpi-h > span { font-size: 13px; font-weight: 550; color: var(--muted); }
  .cc-kpi b {
    margin-top: 6px; font-size: 34px; line-height: 1.05; font-weight: 680;
    letter-spacing: -.03em; font-variant-numeric: tabular-nums;
  }
  .cc-kpi-n { margin-top: auto; padding-top: 8px; font-size: 12.5px; color: var(--faint); line-height: 1.4; }
  .cc-kpi.blue b { color: var(--blue); }
  .cc-kpi.ok b { color: var(--ok); }
  .cc-kpi.warn b { color: var(--warn); }
  .cc-kpi.risk b { color: var(--risk); }
  .cc-spark { display: inline-flex; align-items: flex-end; gap: 3px; height: 26px; }
  .cc-spark i { width: 5px; min-height: 3px; border-radius: 2px; background: var(--ok); opacity: .75; }
  .cc-spark i.vazio { background: var(--hair-strong); opacity: .55; }

  .cc-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .cc-col, .cc-side { display: grid; gap: 18px; min-width: 0; }
  .cc-card { padding: 18px 18px 20px; }
  .cc-card .sec-h { margin-bottom: 12px; }
  .cc-card .sec-h h2 { font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; }

  .cc-rows { list-style: none; display: grid; }
  .cc-row { border-top: 1px solid #F1F3F7; }
  .cc-row:first-child { border-top: 0; }
  .cc-row-pick {
    display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    padding: 12px 8px; border-radius: 10px; font-family: inherit; color: inherit;
    transition: background .16s var(--ease);
  }
  .cc-row-pick:hover { background: #F8FAFC; }
  .cc-row-pick:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .cc-row.on .cc-row-pick { background: var(--blue-soft); }
  .cc-row-simples { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 11px 8px; }
  .cc-ic {
    width: 34px; height: 34px; border-radius: 10px; background: #F2F4F7; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center; flex: none;
  }
  .cc-ic .ic { width: 18px; height: 18px; }
  .cc-row.on .cc-ic { background: #fff; color: var(--blue); }
  .cc-row-t { display: grid; gap: 2px; min-width: 0; }
  .cc-row-t b { font-size: 14px; font-weight: 600; letter-spacing: -.005em; }
  .cc-row-t span { font-size: 12.5px; color: var(--muted); line-height: 1.4; overflow-wrap: anywhere; }
  .cc-quando { color: var(--faint); }
  .cc-row-a { display: flex; gap: 6px; flex: none; }
  .cc-open { font-size: 12.5px; font-weight: 600; color: var(--blue); padding-left: 4px; }
  .cc-urg {
    font-size: 11px; font-weight: 650; letter-spacing: .02em; padding: 3px 8px; border-radius: 999px;
    background: #F2F4F7; color: var(--muted); text-transform: capitalize;
  }
  .cc-urg.alta { background: var(--risk-soft); color: var(--risk); }
  .cc-urg.media { background: var(--warn-soft); color: var(--warn); }
  .cc-urg.baixa { background: var(--blue-soft); color: var(--blue); }
  .cc-start { margin-bottom: 22px; }
  .cc-start-l { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 4px; }
  .cc-start-i {
    display: grid; gap: 3px; padding: 13px 14px; border: 1px solid var(--hair);
    border-radius: var(--r-m); background: #FCFCFD; color: var(--ink);
    transition: border-color .16s var(--ease), background .16s var(--ease);
  }
  .cc-start-i:hover { border-color: var(--blue); background: var(--blue-soft); }
  .cc-start-i:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .cc-start-i b { font-size: 13.5px; font-weight: 650; }
  .cc-start-i span { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .cc-leads { margin-top: 22px; }
  .cc-leads .stats { margin-bottom: 0; }

  .cc-ags { list-style: none; display: grid; gap: 2px; }
  .cc-ag { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 2px; border-top: 1px solid #F1F3F7; }
  .cc-ag:first-child { border-top: 0; }
  .cc-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--hair-strong); }
  .cc-dot.a-trabalhar { background: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .cc-dot.bloqueado { background: var(--risk); box-shadow: 0 0 0 3px var(--risk-soft); }
  .cc-dot.espera-ti { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .cc-dot.na-fila { background: var(--faint); }
  .cc-dot.em-descanso { background: var(--ok); opacity: .6; }
  .cc-ag-t { display: grid; gap: 1px; min-width: 0; }
  .cc-ag-t b { font-size: 13.5px; font-weight: 600; }
  .cc-ag-t span { font-size: 12px; color: var(--muted); }
  .cc-ag-c { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; text-align: right; }
  .cc-foot { margin-top: 10px; padding-top: 10px; border-top: 1px solid #F1F3F7; font-size: 12px; color: var(--faint); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .cc-foot a { color: var(--blue); font-weight: 600; }
  .cc-foot a:hover { text-decoration: underline; }

  .cc-tl { list-style: none; display: grid; gap: 2px; }
  .cc-tl-i { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; padding: 8px 2px; border-top: 1px solid #F1F3F7; align-items: start; }
  .cc-tl-i:first-child { border-top: 0; }
  .cc-tl-q { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .cc-tl-i b { display: block; font-size: 13.5px; font-weight: 600; }
  .cc-tl-i span { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
  .cc-tl-i.ok b::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 7px; vertical-align: middle; }
  .cc-tl-i.risk b::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--risk); margin-right: 7px; vertical-align: middle; }

  .cc-row-simples.risco .cc-ic { background: var(--risk-soft); color: var(--risk); }
  .cc-vazio {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px 4px 6px;
    color: var(--muted); font-size: 13px; line-height: 1.5;
  }
  .cc-vazio .ic { width: 22px; height: 22px; flex: none; color: var(--faint); margin-top: 1px; }
  .cc-vazio.ok .ic { color: var(--ok); }
  .cc-vazio b { display: block; color: var(--ink); font-size: 13.5px; margin-bottom: 2px; }

  @media (max-width: 1080px) {
    .cc-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cc-grid { grid-template-columns: 1fr; }
    .cc-start-l { grid-template-columns: 1fr; }

  @media (max-width: 820px) {
