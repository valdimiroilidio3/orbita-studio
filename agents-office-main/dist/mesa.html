<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Órbita — a mesa de trabalho</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<style>
  /* Órbita — a mesa de trabalho.
     Uma superfície sóbria para o trabalho que se faz todos os dias: o que precisa de ti, os
     leads, a conversa com cada um, o dinheiro. O escritório 3D é onde os agentes vivem; aqui é
     onde tu decides.
     Tokens desde o dia 1: espaçamento em múltiplos de 4, uma escala tipográfica, quatro cores
     semânticas. Nada abaixo inventa um valor que não venha destes. */
  :root {
    /* 1.57.0 · tokens do redesenho: fundo quase branco, tinta quase preta, um
       azul só (#155EEF) e bordas de 1 px. Os nomes antigos ficam — mudar os
       nomes obrigaria a tocar em todas as vistas sem ganho nenhum. */
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --ink: #111318;
    --muted: #667085;
    --faint: #98A2B3;
    --hair: #E2E6ED;
    --hair-strong: #D0D5DD;
    --blue: #155EEF;
    --blue-soft: #EAF2FF;
    --blue-soft-2: #DCE8FF;
    --ok: #12A150; --ok-soft: #ECFDF3;
    --warn: #B54708; --warn-soft: #FFFAEB;
    --risk: #B42318; --risk-soft: #FEF3F2;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --t-xs: 11px; --t-s: 13px; --t-m: 15px; --t-l: 18px; --t-xl: 26px; --t-2xl: 40px;
    --r-s: 9px; --r-m: 12px; --r-l: 16px; --r-xl: 20px;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px -18px rgba(16,24,40,.35);
    --ease: cubic-bezier(.2,.8,.2,1);
    --side: 248px;
    --head: 76px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--ui); font-size: var(--t-m); line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }

  /* ---------- estrutura ---------- */
  .shell { display: flex; min-height: 100vh; }
  .side {
    width: var(--side); flex: none; padding: 20px 16px;
    display: flex; flex-direction: column; gap: 20px;
    position: sticky; top: 0; height: 100vh;
    background: var(--card); border-right: 1px solid var(--hair);
  }
  /* o X de sair: a mesa é uma página inteira, e sem isto só se sai pelo endereço.
     Fica ao lado da marca, no canto, com 44 px de alvo (o mínimo para o dedo). */
  .side-top { display: flex; align-items: center; gap: var(--s2); padding-bottom: 16px; border-bottom: 1px solid var(--hair); }
  .side-top .brand { flex: 1; }
  .side-x {
    width: 34px; height: 34px; flex: none; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); border: 1px solid transparent;
    transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
  }
  .side-x:hover { background: rgba(27,27,31,.06); color: var(--ink); border-color: var(--hair); }
  .side-x svg { width: 15px; height: 15px; }
  .brand { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2); font-size: 18px; font-weight: 680; letter-spacing: -.02em; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    border: 2.5px solid var(--blue); position: relative;
  }
  .brand .mark::after {
    content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--blue);
  }
  /* 12 secções não cabem em todos os ecrãs: é a lista que desliza, não a página
     — o cartão do fundo fica sempre à vista */
  .nav { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; scrollbar-width: thin; }
  .nav a > span:first-of-type { flex: 1; }
  .nav a {
    display: flex; align-items: center; gap: 10px; min-height: 40px;
    padding: 9px var(--s3); border-radius: var(--r-s);
    font-size: 14px; color: var(--ink); font-weight: 500;
    transition: background .16s var(--ease), color .16s var(--ease);
  }
  .nav a:hover { background: rgba(27,27,31,.05); }
  .nav a.on { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
  .nav a .ic { width: 20px; height: 20px; flex: none; color: var(--muted); }
  .nav a.on .ic { color: var(--blue); }
  .nav a .n { margin-left: auto; font-size: var(--t-xs); color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav a.on .n { color: var(--blue); }

  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--s3); }
  .meter { background: rgba(255,255,255,.7); border: 1px solid var(--hair); border-radius: var(--r-m); padding: var(--s3) var(--s4); }
  .meter .mrow { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
  .meter .lbl { font-size: var(--t-xs); color: var(--muted); letter-spacing: .01em; }
  .meter b { font-size: var(--t-m); font-variant-numeric: tabular-nums; font-weight: 600; }
  .meter .bar { height: 4px; border-radius: 4px; background: var(--hair); margin-top: var(--s2); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; transition: width .4s var(--ease); }
  .meter small { display: block; margin-top: var(--s2); font-size: var(--t-xs); color: var(--faint); }
  .espaco { display: flex; flex-direction: column; gap: 2px; padding: 0 var(--s2); }
  .espaco label { font-size: var(--t-xs); color: var(--faint); }
  .espaco select { border: 1px solid var(--hair); background: #fff; border-radius: var(--r-s); padding: 6px var(--s2); font-size: var(--t-s); max-width: 100%; }

  /* 1.57.0 · a coluna do trabalho: cabeçalho fixo em cima, conteúdo por baixo.
     O cabeçalho é branco, 76 px, com um divisor de 1 px — a pesquisa global, as
     notificações e a conta vivem aqui, iguais em todas as páginas. */
  .work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .app-head {
    height: var(--head); flex: none; position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--hair);
  }
  .hsearch { position: relative; flex: 1; max-width: 520px; }
  .hsearch .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--faint); pointer-events: none; }
  .hsearch input {
    width: 100%; height: 40px; padding: 0 72px 0 38px;
    border: 1px solid var(--hair); border-radius: var(--r-s); background: #fff;
    font-size: 14px; color: var(--ink); transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .hsearch input::placeholder { color: var(--faint); }
  .hsearch input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .hsearch kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font: 500 11px/1 var(--ui); color: var(--muted); background: #F2F4F7;
    border: 1px solid var(--hair); border-radius: 6px; padding: 4px 6px;
  }
  .hres {
    position: absolute; left: 0; right: 0; top: 46px; z-index: 40;
    background: #fff; border: 1px solid var(--hair); border-radius: var(--r-m);
    box-shadow: 0 12px 32px -16px rgba(16,24,40,.35); padding: 6px; max-height: 60vh; overflow: auto;
  }
  .hres[hidden] { display: none; }
  .hres .sec-h { margin: 6px 8px 2px; }
  .hres a { display: block; padding: 8px; border-radius: 8px; font-size: 14px; }
  .hres a:hover { background: #F8FAFC; }
  .hres .vazio { padding: 10px 8px; color: var(--muted); font-size: 13px; }
  .hacts { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .hicon {
    width: 44px; height: 44px; border-radius: 10px; position: relative;
    display: inline-flex; align-items: center; justify-content: center; color: var(--muted);
    transition: background .16s var(--ease), color .16s var(--ease);
  }
  .hicon:hover { background: #F2F4F7; color: var(--ink); }
  .hicon .ic { width: 20px; height: 20px; }
  .hicon .ndot {
    position: absolute; top: 8px; right: 9px; min-width: 16px; height: 16px; padding: 0 4px;
    border-radius: 999px; background: var(--blue); color: #fff; font-size: 10px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; border: 2px solid #fff;
  }
  .huser { display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 4px; border-radius: 10px; }
  .huser:hover { background: #F2F4F7; }
  .huser .av {
    width: 36px; height: 36px; border-radius: 50%; background: var(--blue-soft); color: var(--blue);
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    flex: none; overflow: hidden;
  }
  .huser .av img { width: 100%; height: 100%; object-fit: cover; }
  .huser .who { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
  .huser .who b { font-size: 13.5px; font-weight: 600; }
  .huser .who span { font-size: 12px; color: var(--muted); }
  .huser summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .huser summary::-webkit-details-marker { display: none; }
  .hmenu { position: relative; }
  .hmenu-l {
    position: absolute; right: 0; top: 48px; z-index: 40; min-width: 210px;
    background: #fff; border: 1px solid var(--hair); border-radius: var(--r-m);
    box-shadow: 0 12px 32px -16px rgba(16,24,40,.35); padding: 6px;
  }
  .hmenu-l a, .hmenu-l button { display: flex; width: 100%; padding: 9px 10px; border-radius: 8px; font-size: 14px; text-align: left; }
  .hmenu-l a:hover, .hmenu-l button:hover { background: #F8FAFC; }
  .hmenu-l .sep { height: 1px; background: var(--hair); margin: 6px 0; }
  main { flex: 1; min-width: 0; padding: var(--s6) var(--s6) var(--s7); }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s5); }
  .head h1 { font-size: var(--t-2xl); font-weight: 680; letter-spacing: -.025em; line-height: 1.1; }
  .head .sub { margin-top: 6px; color: var(--muted); font-size: var(--t-m); }
  .head .sub b { color: var(--ink); font-weight: 600; }
  .head-acts { display: flex; gap: var(--s2); align-items: center; flex: none; }

  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    min-height: 42px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    background: var(--blue-soft); color: var(--blue); border: 1px solid transparent;
    cursor: pointer; font-family: inherit;
    transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
  }
  .pill:hover { background: var(--blue-soft-2); }
  .pill:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .pill .ic { width: 18px; height: 18px; }
  .pill.stop { background: var(--risk-soft); color: var(--risk); }
  .pill small { font-weight: 450; opacity: .8; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s3); margin-bottom: var(--s6); }
  .stat { background: var(--card); border-radius: var(--r-l); padding: var(--s4) var(--s5); box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 32px; font-weight: 650; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat b.blue { color: var(--blue); }
  .stat span { display: block; margin-top: 2px; color: var(--muted); font-size: var(--t-s); }

  h2 { font-size: var(--t-xl); font-weight: 650; letter-spacing: -.02em; }
  h3 { font-size: var(--t-l); font-weight: 620; letter-spacing: -.01em; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }
  .sec-h .count { color: var(--muted); font-size: var(--t-s); }

  /* ---------- o par: lista + aprovação ---------- */
  .split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: var(--s5); align-items: start; }
  .list { display: flex; flex-direction: column; gap: var(--s2); }
  .item {
    display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left;
    background: var(--card); border-radius: var(--r-l); padding: 15px var(--s4);
    border: 1.5px solid transparent; box-shadow: var(--shadow);
    transition: border-color .18s var(--ease), transform .18s var(--ease);
  }
  .item:hover { transform: translateY(-1px); }
  .item.on { border-color: var(--blue); }
  .item .who { min-width: 0; flex: 1; }
  .item .nm { font-size: 16px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .mt { color: var(--muted); font-size: var(--t-s); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: none; font-size: var(--t-s); font-weight: 600; padding: 5px 10px; border-radius: 999px;
    background: var(--ok-soft); color: var(--ok); font-variant-numeric: tabular-nums;
  }
  .badge.mid { background: var(--warn-soft); color: var(--warn); }
  .badge.low { background: #F1F1F3; color: var(--muted); }
  .badge.blue { background: var(--blue-soft); color: var(--blue); }

  .card { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-l); padding: var(--s5); box-shadow: 0 1px 2px rgba(16,24,40,.04); }
  .detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); }
  .detail-top h3 { font-size: 28px; font-weight: 650; letter-spacing: -.025em; }
  .detail-top .mt { color: var(--muted); margin-top: 4px; font-size: var(--t-m); }
  .msg-label { display: flex; align-items: center; gap: var(--s2); color: var(--muted); font-size: var(--t-s); margin: var(--s5) 0 var(--s2); }
  .msg-label .ic { width: 16px; height: 16px; }
  .bubble {
    background: #EFF0FE; border-radius: var(--r-m); padding: var(--s4) var(--s5);
    font-size: var(--t-l); line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .why-box { border: 1px solid var(--hair); border-radius: var(--r-m); padding: var(--s3) var(--s4); margin-top: var(--s4); }
  .why-box summary { list-style: none; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 600; }
  .why-box summary::-webkit-details-marker { display: none; }
  .why-box summary span { color: var(--muted); font-weight: 400; font-size: var(--t-s); display: block; }
  .why-box summary .chev { transition: transform .2s var(--ease); color: var(--faint); }
  .why-box[open] summary .chev { transform: rotate(90deg); }
  .why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin-top: var(--s4); }
  .why {
    display: flex; gap: var(--s3); align-items: flex-start; background: #F6F6F8;
    border-radius: var(--r-s); padding: var(--s3) var(--s4); font-size: var(--t-s); line-height: 1.35;
  }
  .why .tick { color: var(--ok); flex: none; margin-top: 1px; }
  /* =========================================================================
     1.57.1 · OS BOTÕES
     Um botão tem de se ver que é um botão e de se acertar com o dedo. Altura
     mínima de 46 px (48 no telemóvel), 20 px de respiro lateral, raio de 11 px,
     ícone de 18 px alinhado ao texto, e três estados que se distinguem sem
     adivinhar: repouso com sombra de 1 px, hover que escurece o fundo, e
     `:focus-visible` com anel de 2 px — quem navega por teclado vê onde está.
     `.small` é para tabelas e cabeçalhos (38 px); `.quiet` não tem caixa.
     ========================================================================= */
  .acts { display: flex; gap: 10px; margin-top: var(--s5); flex-wrap: wrap; }
  .btn {
    --btn-h: 46px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: var(--btn-h); padding: 0 20px; border-radius: 11px;
    font-family: inherit; font-size: 14.5px; line-height: 1; font-weight: 600; letter-spacing: -.005em;
    white-space: nowrap; border: 1px solid transparent; cursor: pointer;
    background: #fff; color: var(--ink);
    box-shadow: 0 1px 2px rgba(16, 24, 40, .05);
    transition: background .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease),
      box-shadow .16s var(--ease), transform .1s var(--ease);
  }
  .btn .ic { width: 18px; height: 18px; flex: none; }
  .btn:hover { box-shadow: 0 2px 8px -2px rgba(16, 24, 40, .16); }
  .btn:active { transform: translateY(1px); box-shadow: none; }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .btn.primary {
    background: var(--blue); border-color: var(--blue); color: #fff;
    box-shadow: 0 1px 2px rgba(21, 94, 239, .30), 0 8px 18px -12px rgba(21, 94, 239, .9);
  }
  .btn.primary:hover { background: #004EEB; border-color: #004EEB; }
  .btn.ghost { background: #fff; border-color: var(--hair-strong); color: var(--ink); }
  .btn.ghost:hover { background: #F8FAFC; border-color: #B9C0CC; }
  .btn.quiet {
    background: transparent; border-color: transparent; color: var(--muted);
    box-shadow: none; padding: 0 12px;
  }
  .btn.quiet:hover { background: #F2F4F7; color: var(--ink); box-shadow: none; }
  .btn.danger { background: #fff; border-color: #F2C3BE; color: var(--risk); }
  .btn.danger:hover { background: var(--risk-soft); border-color: var(--risk); }
  .btn.small { --btn-h: 38px; padding: 0 14px; font-size: 13px; border-radius: 9px; gap: 6px; }
  .btn.small .ic { width: 16px; height: 16px; }
  .btn:disabled, .btn[aria-disabled="true"] {
    opacity: .48; cursor: not-allowed; box-shadow: none; transform: none;
  }
  /* os botões dentro de `.acts` têm largura mínima confortável em vez de esticar
     até ao fim do cartão — dois botões de 500 px não se lêem melhor */
  .acts > .btn { min-width: 148px; }

  /* =========================================================================
     1.69.0 · A ENTRADA (6 nov 2026)
     Três caminhos na mesma coluna: GitHub, Google, ou email com um código. O
     botão do fornecedor é largo e alinhado à esquerda (é o gesto mais provável
     para quem chega), e quando lhe falta a chave fica com contorno tracejado —
     clicável, porque o clique é que diz o que falta. Nunca `disabled`: um botão
     cinzento não explica nada a ninguém.
     ========================================================================= */
  .entrada-fornecedores { display: grid; gap: 10px; margin-bottom: var(--s3); }
  .entrada-fornecedor { width: 100%; justify-content: flex-start; padding: 0 18px; }
  .entrada-fornecedor .entrada-ic { display: inline-flex; align-items: center; }
  .entrada-fornecedor .entrada-ic .ic { width: 20px; height: 20px; }
  .entrada-fornecedor[data-falta="1"] { border-style: dashed; border-color: var(--hair-strong); }
  .entrada-falta { margin: -4px 0 2px 2px; font-size: 12.5px; }
  .entrada-ou {
    display: flex; align-items: center; gap: var(--s3);
    color: var(--muted); font-size: 12.5px; margin: var(--s2) 0 var(--s4);
  }
  .entrada-ou::before, .entrada-ou::after { content: ''; height: 1px; flex: 1; background: var(--hair); }
  .entrada-codigo {
    font: 600 26px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .34em; text-align: center; padding: 14px 10px;
  }
  .entrada-aviso {
    border-left: 3px solid var(--blue); padding: 10px 12px;
    background: #F5F8FF; border-radius: 8px; margin-top: var(--s3);
  }

  /* =========================================================================
     1.73.0 · A ENTRADA (6 nov 2026, terceira passagem)

     O dono disse-o sem rodeios: «o design da página de login está ridículo» — e
     o que estava ridículo era a PÁGINA, não a arte: meia dúzia de parágrafos
     técnicos por baixo de dois campos, com nomes de variáveis de ambiente
     (`RESEND_API_KEY`, `SETUP_TOKEN`), o modo da instalação e um cartão com as
     tabelas em falta. Nada disso é uma página de entrada; é o diagnóstico de uma
     máquina. Isso mudou de sítio (fica atrás de «Estado da instalação», fechado)
     e o que ficou é o que uma pessoa precisa de ver:

       um título, uma linha, as duas contas com que se entra, dois campos, um
       botão. E nada mais.

     A arte (anéis + portas a girar) continua: é a metade esquerda, desaparece no
     telemóvel, e não se põe entre a pessoa e o botão.
     ========================================================================= */
  /* a entrada ocupa a janela toda: o `main` tem margem para as vistas de
     trabalho, e aqui só roubava altura ao formulário */
  main:has(> .palco) { padding: 0; }
  .palco {
    display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
    min-height: 100dvh; background: #FBFBFD;
  }
  .palco-arte {
    position: relative; overflow: hidden; border-right: 1px solid var(--hair);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--s5); padding: var(--s7) var(--s6);
    background:
      radial-gradient(52% 40% at 50% 44%, rgba(21,94,239,.085) 0%, rgba(21,94,239,0) 72%),
      linear-gradient(180deg, #F8FAFF 0%, #FBFBFD 68%);
  }
  .palco-centro {
    position: relative; width: min(520px, 94%); aspect-ratio: 1 / 1;
    display: grid; place-items: center;
  }
  .aneis {
    position: absolute; inset: 0; display: grid; place-items: center;
    -webkit-mask-image: linear-gradient(to bottom, #000 26%, transparent 90%);
    mask-image: linear-gradient(to bottom, #000 26%, transparent 90%);
  }
  .anel {
    position: absolute; width: var(--px); height: var(--px); border-radius: 50%;
    border: 1px solid rgba(21,94,239,.30);
    animation: anelPulso 4.2s ease-in-out infinite;
  }
  @keyframes anelPulso {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(.945); }
  }
  .orbitas { position: absolute; inset: 0; }
  .orbita {
    position: absolute; top: 50%; left: 50%; width: 0; height: 0;
    animation: orbitaGiro calc(var(--dur) * 1s) linear infinite;
    animation-delay: calc(var(--atraso) * -1s);
  }
  .orbita.reversa { animation-direction: reverse; }
  .porta {
    position: absolute; top: 0; left: 0;
    width: calc(var(--tam) * 1px); height: calc(var(--tam) * 1px);
    display: grid; place-items: center; border-radius: 50%;
    background: #fff; box-shadow: 0 6px 18px rgba(17,19,24,.09), 0 0 0 1px rgba(17,19,24,.05);
    transform: translate(-50%, -50%) translateY(calc(var(--raio) * -1px));
  }
  /* o ícone contra-gira para não andar de pernas para o ar */
  .porta > .ic {
    width: 54%; height: 54%;
    animation: orbitaGiro calc(var(--dur) * 1s) linear infinite;
    animation-delay: inherit; animation-direction: reverse;
  }
  .orbita.reversa .porta > .ic { animation-direction: normal; }
  @keyframes orbitaGiro { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  /* a marca é a mesma do resto da mesa: um anel azul com o miolo cheio */
  .palco-marca .mark, .marca-mini .mark {
    width: 22px; height: 22px; border-radius: 50%; flex: none;
    border: 2.5px solid var(--blue); position: relative;
  }
  .palco-marca .mark::after, .marca-mini .mark::after {
    content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--blue);
  }
  .palco-marca {
    position: relative; z-index: 2; display: flex; align-items: center; gap: 10px;
    padding: 11px 18px; background: rgba(255,255,255,.9); border-radius: 999px;
    box-shadow: 0 10px 30px rgba(17,19,24,.09), 0 0 0 1px rgba(17,19,24,.05);
    font-size: 17px; letter-spacing: .01em; backdrop-filter: blur(8px);
  }
  .palco-marca b { font-weight: 650; }
  .palco-sub {
    margin: 0; max-width: 34ch; text-align: center; color: var(--muted);
    font-size: 13px; line-height: 1.6;
  }
  .palco-rodape { color: #9AA1AC; font-size: 11.5px; letter-spacing: .01em; }
  .palco-lado { display: grid; place-items: center; padding: var(--s6) var(--s5); }
  .palco-cartao { width: 100%; max-width: 392px; }
  /* a arte desaparece no telemóvel: a marca fica, discreta, acima do título */
  .marca-mini { display: none; align-items: center; gap: 8px; margin-bottom: 22px; font-size: 15px; letter-spacing: .01em; }
  .marca-mini b { font-weight: 650; }
  @media (max-width: 900px) { .marca-mini { display: flex; } }

  /* ---------- a ficha: título, caminhos, campos, botão. Nada mais. ---------- */
  .enta { display: flex; flex-direction: column; gap: 0; }
  .enta-h1 {
    margin: 0 0 6px; font-size: 30px; line-height: 1.14; font-weight: 660;
    letter-spacing: -.022em; color: var(--ink);
  }
  .enta-sub { margin: 0 0 26px; color: var(--muted); font-size: 14px; line-height: 1.55; }
  .enta-aviso {
    display: flex; gap: 10px; align-items: flex-start;
    margin: 0 0 20px; padding: 11px 13px; border-radius: 11px;
    background: #FFF6F5; color: #8A2B23; font-size: 13px; line-height: 1.5;
    border: 1px solid #F6DCD8;
  }
  .enta-aviso .ic { width: 16px; height: 16px; flex: none; margin-top: 1px; }
  /* o atalho para a consola vive dentro do aviso: é parte da resposta, não um
     botão à parte a competir com o «Entrar» */
  .enta-consola {
    display: inline-block; margin-top: 7px; padding: 5px 9px;
    border-radius: 8px; background: #fff; color: #8A2B23;
    border: 1px solid #F0CFC9; font-size: 12.5px; font-weight: 550;
    text-decoration: none;
  }
  .enta-consola:hover { background: #FFF1EF; }
  /* o que é boa notícia não se veste de erro */
  .enta-aviso[data-tom="ok"] { background: #F1FAF5; color: #1B6B4C; border-color: #D5EDE0; }
  /* o detalhe preciso do clique (nome da variável, sítio, endereço de retorno):
     vive dentro do «Estado da instalação», com quebras onde fazem falta */
  .enta-det-preciso { color: #4A515C; line-height: 1.55; overflow-wrap: anywhere; }
  .enta-prov { display: grid; gap: 9px; }
  .enta-prov-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; height: 46px; padding: 0 14px;
    background: #fff; color: var(--ink); font-size: 14.5px; font-weight: 550;
    border: 1px solid #E2E5EB; border-radius: 12px;
    box-shadow: 0 1px 2px rgba(17,19,24,.04);
    transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .15s var(--ease);
  }
  .enta-prov-btn:hover { background: #F7F8FB; border-color: #D6DAE2; }
  .enta-prov-btn:active { transform: translateY(1px); }
  /* um caminho sem chave NÃO fica cinzento: fica tracejado e diz o que falta */
  .enta-prov-btn[data-falta="1"] { border-style: dashed; color: var(--muted); }
  .enta-prov-btn .ic { width: 18px; height: 18px; flex: none; }
  .enta-ou {
    display: flex; align-items: center; gap: 12px;
    color: #9AA1AC; font-size: 12px; margin: 18px 0;
  }
  .enta-ou::before, .enta-ou::after { content: ''; height: 1px; flex: 1; background: #E7E9EE; }
  .enta-campos { display: grid; gap: 13px; }
  .enta-campo { display: grid; gap: 6px; }
  .enta-lb { font-size: 12.5px; font-weight: 560; color: #4A515C; letter-spacing: .005em; }
  .enta-in-cx { position: relative; }
  /* o olho ocupa 44 px à direita: o texto não passa por baixo dele */
  .enta-in-cx:has(.enta-olho) .enta-in { padding-right: 46px; }
  .enta-in {
    width: 100%; box-sizing: border-box; height: 46px; padding: 0 13px;
    border: 1px solid #E2E5EB; border-radius: 12px; background-color: #fff;
    font-size: 14.5px; color: var(--ink); -webkit-appearance: none;
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease), background-image .2s linear;
    /* o halo segue o rato: `--mx`/`--my` são escritos em `mesa.js` */
    background-image: radial-gradient(150px circle at var(--mx, -300px) var(--my, -300px),
      rgba(21,94,239,.10), rgba(21,94,239,0) 72%);
    background-repeat: no-repeat;
  }
  .enta-in::placeholder { color: #A3A9B4; }
  .enta-in:hover { border-color: #D6DAE2; }
  .enta-in:focus {
    outline: none; border-color: var(--blue);
    box-shadow: 0 0 0 3.5px rgba(21,94,239,.13);
  }
  .enta-in:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px #fff inset; }
  .enta-olho {
    position: absolute; top: 0; right: 0; height: 46px; width: 44px;
    display: grid; place-items: center; background: none; border: 0;
    color: #8A919C; border-radius: 0 12px 12px 0;
  }
  .enta-olho:hover { color: var(--ink); }
  .enta-olho .ic { width: 18px; height: 18px; }
  .enta-btn {
    width: 100%; height: 48px; margin-top: 18px;
    background: var(--ink); color: #fff; font-size: 15px; font-weight: 600;
    border: 0; border-radius: 12px; letter-spacing: -.005em;
    box-shadow: 0 1px 2px rgba(17,19,24,.18);
    transition: background-color .15s var(--ease), transform .15s var(--ease);
  }
  .enta-btn:hover { background: #000; }
  .enta-btn:active { transform: translateY(1px); }
  .enta-btn[aria-disabled="true"] { opacity: .55; }
  .enta-links {
    display: flex; gap: 6px 16px; flex-wrap: wrap; justify-content: center;
    margin-top: 18px;
  }
  .enta-link {
    background: none; border: 0; padding: 2px; font-size: 13px; color: #5A6270;
    text-decoration: none; border-radius: 6px;
  }
  .enta-link:hover { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }
  .enta-pe {
    margin: 26px 0 0; padding-top: 18px; border-top: 1px solid #EDEFF3;
    color: #9AA1AC; font-size: 12px; line-height: 1.5; text-align: center;
  }
  .enta-pe b { color: #6B7280; font-weight: 560; }
  .enta-det { margin-top: 14px; }
  .enta-det > summary {
    cursor: pointer; list-style: none; text-align: center;
    font-size: 12px; color: #A4AAB4; padding: 6px 0; border-radius: 8px;
  }
  .enta-det > summary::-webkit-details-marker { display: none; }
  .enta-det > summary:hover { color: #6B7280; }
  .enta-det[open] > summary { color: #6B7280; }
  .enta-det-corpo {
    margin-top: 10px; padding: 14px; border: 1px solid #EDEFF3; border-radius: 12px;
    background: #FCFCFE; font-size: 12.5px; color: var(--muted);
  }
  .enta-det-corpo .card { box-shadow: none; border: 0; padding: 0; background: none; }
  .enta-det-corpo p { margin: 0 0 8px; }
  .enta-codigo {
    font: 600 30px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .42em; text-align: center; padding: 0 8px 0 14px; text-indent: .42em;
  }
  /* a cascata (o `BoxReveal`): cada bloco entra 14 px abaixo e assenta */
  .rev { animation: revEntra .5s cubic-bezier(.22,.7,.2,1) both; }
  @keyframes revEntra {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 900px) {
    .palco { grid-template-columns: 1fr; }
    .palco-arte { display: none; }
    .palco-lado { padding: 9vh var(--s4) var(--s6); align-items: start; }
    .palco-cartao { max-width: 440px; }
    .enta-h1 { font-size: 27px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .anel, .orbita, .porta > .ic, .rev { animation: none !important; }
  }

  /* 30 out 2026 · o aviso do modo local (pedido do dono: «chega de demonstrações só»).
     Não é um erro e não se fecha: é a informação de onde os dados vivem. Discreto no
     desktop, duas linhas no telemóvel, e as acções da cópia sempre à mão. */
  .localbar {
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    margin: var(--s3) var(--s4) 0; padding: 10px 12px 10px 14px;
    background: #FFF8E6; border: 1px solid #F0DCB0; border-radius: var(--r2, 12px);
    font-size: var(--t-xs, 12px); line-height: 1.45; color: #6B5320;
  }
  .localbar b { color: #4A3A12; }
  .localbar > span:first-child { flex: 1 1 260px; min-width: 0; }
  .localbar .lb-act { display: flex; gap: 4px; flex: none; }
  .localbar .btn { color: #6B5320; }
  .localbar .btn:hover { color: #2F2609; }
  @media (max-width: 720px) {
    .localbar { margin: var(--s2) var(--s2) 0; font-size: 12px; }
    .localbar .lb-act { width: 100%; justify-content: flex-end; flex-wrap: wrap; }
  }
  /* ---- 1.18.0 · AI Control Center ---- */
  .ia-faixa { margin: var(--s3) var(--s4) 0; padding: 12px 14px; border-radius: var(--r2, 12px);
    font-size: var(--t-sm, 14px); line-height: 1.5; border: 1px solid; }
  .ia-faixa.ok { background: #EDF9F1; border-color: #CBE9D5; color: #1F5B37; }
  .ia-faixa.bad { background: #FDF3EC; border-color: #F3D9C6; color: #7A4115; }
  /* 1.83.0 · estas duas cores faltavam: a faixa «a demorar» e a «não consegui
     actualizar» saíam só com a borda, sem fundo — pareciam texto solto. */
  .ia-faixa.warn { background: #FEF7E4; border-color: #EBDBB2; color: #6E5410; }
  .ia-faixa.info { background: #EFF4FD; border-color: #D3E0F5; color: #24405F; }
  /* 1.50.0 · a conversa da IA: mensagens com quem falou e o que respondeu */
  .ia-chat { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto;
    padding: 10px 12px; margin: 0 0 10px; border: 1px solid var(--line); border-radius: var(--r2, 12px);
    background: var(--paper-2, rgba(0,0,0,.02)); }
  .ia-msg { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; line-height: 1.5; max-width: 78ch; }
  .ia-msg b { font-family: var(--ui); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .ia-msg.eu { align-self: flex-end; align-items: flex-end; text-align: right; }
  .ia-msg.eu div { background: var(--ink); color: var(--paper); padding: 8px 12px; border-radius: 12px; }
  .ia-msg.ia div { background: #fff; border: 1px solid var(--line); padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; }
  .ia-msg.erro div { background: #FDF3EC; border: 1px solid #F3D9C6; color: #7A4115; padding: 8px 12px; border-radius: 12px; }
  .ia-faixa code { background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 6px; font-size: 12px; }
  .ia-sub { font-size: var(--t-xs, 12px); opacity: .72; line-height: 1.45; }
  .ia-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .ia-tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    letter-spacing: .02em; border: 1px solid rgba(0,0,0,.12); background: #F2F2F0; white-space: nowrap; }
  .ia-tag.ok { background: #E7F6ED; border-color: #C3E5D2; color: #1F5B37; }
  .ia-tag.bad { background: #FBEDE7; border-color: #F0CFC0; color: #8A3A16; }
  .ia-tag.warn { background: #FEF7E4; border-color: #EBDBB2; color: #6E5410; }
  .ia-tab { width: 100%; border-collapse: collapse; font-size: var(--t-sm, 14px); }
  .ia-tab th { text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; opacity: .6; padding: 8px 10px; border-bottom: 1px solid var(--line, #E6E6E2); }
  .ia-tab td { padding: 9px 10px; border-bottom: 1px solid var(--line, #E6E6E2); vertical-align: top; }
  .ia-tab tr:last-child td { border-bottom: 0; }
  .ia-tab tr.ia-ok td:first-child { box-shadow: inset 3px 0 0 #2E9E63; }
  .ia-acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .ia-select { max-width: 320px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line, #DDD);
    background: #fff; font: inherit; font-size: 13px; }
  .ia-input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line, #DDD); font: inherit; font-size: 14px; line-height: 1.5; resize: vertical; }
  .ia-plano { margin: 10px 0; padding-left: 20px; font-size: 14px; }
  .ia-plano li { margin: 6px 0; }
  .ia-run-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .ia-run { border-left: 3px solid #2E9E63; }
  .ia-revisao { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #FAFAF8; }
  .ia-resultado { margin-top: 10px; }
  .ia-resultado pre { white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; background: #FAFAF8;
    padding: 10px; border-radius: 10px; max-height: 420px; overflow: auto; }
  .ia-erro { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #FBEDE7; color: #8A3A16; font-size: 13px; }
  .ia-erros { margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
  .ia-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .ia-ferramenta { border: 1px solid var(--line, #E6E6E2); border-radius: 10px; padding: 9px 11px; font-size: 13px; }
  .ia-ferramenta b { display: inline-block; margin-right: 6px; }
  .ia-linha-run { cursor: pointer; }
  .ia-linha-run:hover td { background: #FAFAF8; }
  @media (max-width: 720px) {
    .ia-faixa { margin: var(--s2) var(--s2) 0; }
    .ia-tab { font-size: 13px; }
    .ia-tab th:nth-child(4), .ia-tab td:nth-child(4) { display: none; }
    .ia-select { max-width: 100%; }
  }

  /* 1.17.0 · quando a base responde, a barra é só uma linha discreta a dizer isso */
  .basebar {
    display: flex; align-items: center; gap: 8px;
    margin: var(--s3) var(--s4) 0; padding: 7px 12px;
    background: #EDF9F1; border: 1px solid #CBE9D5; border-radius: var(--r2, 12px);
    font-size: var(--t-xs, 12px); color: #1F5B37;
  }
  .basebar .dot { width: 7px; height: 7px; border-radius: 50%; background: #2E9E63; flex: none; }
  @media (max-width: 720px) { .basebar { margin: var(--s2) var(--s2) 0; } }
  .btn.quiet:hover { color: var(--ink); }

  .hint { color: var(--muted); font-size: var(--t-s); margin-top: var(--s3); }
  .hint.bad { color: var(--risk); }
  .empty { text-align: center; padding: var(--s6) var(--s5); }
  .empty .ic { width: 34px; height: 34px; color: var(--faint); margin-bottom: var(--s3); }
  .empty h3 { margin-bottom: var(--s2); }
  .empty p { color: var(--muted); max-width: 46ch; margin: 0 auto; }

  /* ---------- tabela de leads ---------- */
  .tools { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; margin-bottom: var(--s4); }
  .search {
    flex: 1; min-width: 220px; display: flex; align-items: center; gap: var(--s2);
    background: #fff; border: 1px solid var(--hair); border-radius: 999px; padding: 10px var(--s4);
  }
  .search input { border: 0; outline: none; width: 100%; background: transparent; font-size: var(--t-m); }
  .search .ic { color: var(--faint); width: 18px; height: 18px; flex: none; }
  .chip {
    min-height: 38px; padding: 0 16px; border-radius: 999px; font-size: 13.5px; font-weight: 550;
    background: #fff; border: 1px solid var(--hair); color: var(--muted);
    cursor: pointer; font-family: inherit;
    transition: background .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease);
  }
  .chip:hover { border-color: var(--hair-strong); color: var(--ink); }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .rows { background: var(--card); border-radius: var(--r-l); overflow: hidden; box-shadow: var(--shadow); }
  .row {
    display: grid; grid-template-columns: 1fr 150px 120px 92px; gap: var(--s3); align-items: center;
    width: 100%; text-align: left; padding: var(--s4) var(--s5); border-bottom: 1px solid var(--hair);
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: #FAFAFB; }
  .row .nm { font-weight: 600; letter-spacing: -.01em; }
  .row .mt { color: var(--muted); font-size: var(--t-s); margin-top: 1px; }
  .row .cell { color: var(--muted); font-size: var(--t-s); }
  .tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: var(--t-xs); font-weight: 600; background: #F1F1F3; color: var(--muted); }
  .tag.novo { background: var(--blue-soft); color: var(--blue); }
  .tag.contactado { background: var(--warn-soft); color: var(--warn); }
  .tag.respondeu, .tag.reuniao { background: var(--ok-soft); color: var(--ok); }
  .tag.cliente { background: #E7F0FF; color: #1B57C7; }
  .tag.perdido { background: var(--risk-soft); color: var(--risk); }

  /* =========================================================================
     1.59.0 · O CRM (2 nov 2026)

     O que estes estilos têm de dizer, e não é decoração:
       · a confiança e a verificação são etiquetas com a cor do estado e o
         motivo no `title` — quem quiser saber porquê, passa o rato;
       · na lista, a próxima ação fica debaixo do nome, na cor do atraso:
         um passo esquecido tem de se ver sem abrir a ficha;
       · os duplicados são cartões, não um aviso que se fecha e esquece.
     ========================================================================= */
  .crm-card .sec-h { gap: var(--s2); }
  .crm-card .stats { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--s2); margin-bottom: var(--s3); }
  .crm-fase { padding: var(--s3) var(--s3); border-radius: var(--r-m); box-shadow: none; border: 1px solid var(--hair); background: #FCFCFD; }
  .crm-fase b { font-size: 22px; }
  .crm-fase span { font-size: 11px; line-height: 1.25; }
  .crm-sinais { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--t-s); color: var(--muted); }
  .crm-sinal b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .crm-prox { font-size: 11.5px; margin-top: 2px; line-height: 1.35; }
  .row.crm { grid-template-columns: minmax(0, 1fr) 190px 128px 118px 92px; }
  .row.crm .cell { min-width: 0; overflow-wrap: anywhere; }
  .crm-prova table { width: 100%; border-collapse: collapse; }
  .crm-prova td { padding: 7px 0; border-bottom: 1px solid var(--hair); font-size: var(--t-s); vertical-align: top; }
  .crm-prova tr:last-child td { border-bottom: 0; }
  .crm-prova td:first-child { padding-right: var(--s4); }
  .crm-bar { height: 6px; border-radius: 999px; background: #EDEEF1; overflow: hidden; margin: 2px 0 var(--s3); }
  .crm-bar i { display: block; height: 100%; border-radius: 999px; }
  .crm-dup { margin-top: var(--s3); border: 1px solid var(--hair); border-radius: var(--r-m); overflow: hidden; }
  .crm-dup-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: var(--s3); background: #FCFCFD; border-bottom: 1px solid var(--hair); }
  .crm-dup-h span { color: var(--muted); font-size: 11.5px; }
  .crm-dup-g { padding: var(--s3); border-bottom: 1px solid var(--hair); }
  .crm-dup-g:last-child { border-bottom: 0; }
  .crm-dup-m { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .crm-dup-l { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--s2); }
  .crm-dup-i {
    display: grid; gap: 1px; text-align: left; font: inherit; cursor: pointer;
    padding: var(--s2) var(--s3); border-radius: var(--r-m); border: 1px solid var(--hair);
    background: var(--card); transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .crm-dup-i:hover { border-color: var(--ink); box-shadow: var(--shadow); }
  .crm-dup-i:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .crm-dup-i b { font-size: var(--t-m); }
  .crm-dup-i span { font-size: 11.5px; color: var(--muted); }
  .crm-dup-i em { font-style: normal; font-size: 11px; color: var(--blue); }
  @media (max-width: 1080px) {
    .crm-card .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .row.crm { grid-template-columns: minmax(0, 1fr) 160px 110px 96px; }
    .row.crm .cell.crm-conf { display: none; }
  }
  @media (max-width: 820px) {
    .crm-card .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row.crm { grid-template-columns: minmax(0, 1fr) auto; }
    .row.crm .cell { display: none; }
    .row.crm .cell.tag-cell { display: block; }
  }

  /* ---------- projetos ---------- */
  .steps { list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s2); margin-bottom: var(--s2); }
  .steps li { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-m); padding: var(--s3); position: relative; }
  .steps li b { display: block; font-size: var(--t-s); font-weight: 620; }
  .steps li small { display: block; color: var(--faint); font-size: 11px; line-height: 1.3; margin-top: 2px; }
  .steps li.done { border-color: rgba(18,128,94,.35); background: linear-gradient(0deg, var(--ok-soft), var(--ok-soft)); }
  .steps li.done b { color: var(--ok); }
  .steps li.now { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .steps li.now b { color: var(--blue); }
  .steps li.bad { border-color: rgba(179,54,31,.35); background: var(--risk-soft); }
  .steps li.bad b { color: var(--risk); }
  .qa-head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s2); }
  .qa-list { list-style: none; display: grid; gap: var(--s2); margin-top: var(--s2); }
  .qa-list li { font-size: var(--t-s); color: var(--muted); border-left: 3px solid var(--hair); padding-left: var(--s3); line-height: 1.4; }
  .qa-list li.critico { border-color: var(--risk); }
  .qa-list li.importante { border-color: var(--warn); }
  .qa-list li.menor { border-color: var(--hair-strong); }
  .qa-list code { font-size: 11px; background: #F1F1F3; padding: 1px 5px; border-radius: 4px; color: var(--ink); }
  .feed { list-style: none; display: grid; gap: var(--s2); }
  .feed li { border-top: 1px solid var(--hair); padding-top: var(--s2); font-size: var(--t-s); }
  .feed li:first-child { border-top: 0; padding-top: 0; }
  @media (max-width: 820px) {
    .steps { grid-template-columns: 1fr 1fr; }
  }

  /* ---------- saldo ---------- */
  .cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
  .money { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); margin-bottom: var(--s5); }
  .money .card { padding: var(--s4) var(--s5); border-radius: var(--r-l); }
  .money b { display: block; font-size: 30px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .money small { color: var(--muted); font-size: var(--t-s); }
  .money b.ok { color: var(--ok); } .money b.bad { color: var(--risk); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 650; padding: 0 var(--s2) var(--s2); }
  td { padding: 10px var(--s2); border-top: 1px solid var(--hair); font-size: var(--t-m); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .form { display: grid; grid-template-columns: 140px 1fr auto; gap: var(--s2); margin-bottom: var(--s5); }
  .form.three { grid-template-columns: 1fr 1fr 1fr; }
  .form.two { grid-template-columns: 1fr 1fr auto; }
  /* 1.36.0 · campos com rótulo por cima (editar um lead): o rótulo é pequeno e
     discreto, o campo ocupa o espaço todo, e em ecrã estreito passa a uma coluna */
  .form.pares { grid-template-columns: 1fr 1fr; align-items: end; }
  .fld { display: grid; gap: 4px; }
  .fld > span { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  .fld .in { width: 100%; box-sizing: border-box; }
  .in {
    border: 1px solid var(--hair); background: #fff; border-radius: var(--r-s);
    padding: 11px var(--s3); font-size: var(--t-m); width: 100%;
    transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  .in:hover { border-color: var(--hair-strong); }
  .in:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(21,94,239,.14); }
  .in[aria-invalid="true"] { border-color: var(--risk); box-shadow: 0 0 0 3px rgba(180,35,24,.12); }

  /* ---------- estados, avisos, barra inferior ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: #1B1B1F; color: #fff; padding: 13px var(--s5); border-radius: 999px;
    font-size: var(--t-s); box-shadow: 0 16px 40px rgba(0,0,0,.22);
    opacity: 0; pointer-events: none; transition: opacity .22s var(--ease), transform .22s var(--ease); z-index: 60;
    max-width: min(560px, 90vw); text-align: center;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--risk); }
  .tabbar { display: none; }
  /* o X do telemóvel: 44 px de alvo, no canto, sempre por cima do conteúdo */
  .m-x { display: none; }
  @media (max-width: 820px) {
    .m-x {
      display: inline-flex; position: fixed; top: 10px; right: 10px; z-index: 60;
      width: 44px; height: 44px; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255,255,255,.96); color: var(--ink);
      border: 1px solid var(--hair); box-shadow: 0 1px 2px rgba(20,20,24,.06);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .m-x svg { width: 17px; height: 17px; }
    .m-x:active { background: #F2F2F0; }
    /* para o X não tapar o botão «Sair» do cabeçalho */
    main { padding-top: calc(var(--s5) + 34px); }
  }
  .skeleton { color: var(--faint); padding: var(--s6); text-align: center; }

  @media (max-width: 1080px) {
    .split { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 1fr 110px 92px; }
    .row .cell.hide-m { display: none; }
  }
  @media (max-width: 820px) {
    .side { display: none; }
    main { padding: var(--s5) var(--s4) 96px; }
    .head { flex-direction: column; gap: var(--s3); }
    .head h1 { font-size: 32px; }
    .stats { gap: var(--s2); }
    .stat { padding: var(--s3) var(--s4); border-radius: var(--r-m); }
    .stat b { font-size: 26px; }
    .card { padding: var(--s4); border-radius: var(--r-l); }
    .detail-top h3 { font-size: 24px; }
    .bubble { font-size: var(--t-m); }
    .why-grid { grid-template-columns: 1fr; }
    .money { grid-template-columns: 1fr; }
    .cards2 { grid-template-columns: 1fr; }
    .form, .form.three, .form.two, .form.pares { grid-template-columns: 1fr; }
    .acts { position: sticky; bottom: 84px; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: var(--s2) 0; }
    .tabbar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
      border-top: 1px solid var(--hair); padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }
    .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); padding: 4px 0; border-radius: var(--r-s); }
    .tabbar a.on { color: var(--blue); font-weight: 600; }
    .tabbar .ic { width: 22px; height: 22px; }
    .row { grid-template-columns: 1fr auto; padding: var(--s3) var(--s4); }
    .row .cell, .row .cell.hide-m { display: none; }
    .toast { bottom: 96px; }
  }
  /* =========================================================================
     1.60.0 · MOTORES, AUTONOMIA E SALDO, E O TELEMÓVEL COMO SÍTIO PRÓPRIO

     Regras que estes estilos seguem, e que não são decoração:
       · um número por cartão, e o «desconhecido» tem de ser legível (não um
         zero que se confunde com grátis);
       · a cor diz o estado e nada mais: verde = há prova, âmbar = falta,
         vermelho = falhou. Sem verde em «nunca verificado»;
       · no telemóvel a barra de decisões fica acima dos separadores, com
         alvos de 44 px — cabe no polegar de uma mão;
       · com movimento reduzido, nada desliza: a informação já está lá.
     ========================================================================= */
  .mo-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s3); margin-bottom: var(--s4); }
  .mo-kpi { background: var(--card); border-radius: var(--r-l); padding: var(--s4) var(--s4) calc(var(--s4) - 2px); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
  .mo-kpi-t { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
  .mo-kpi b { font-size: 28px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .mo-kpi-n { font-size: var(--t-xs, 12px); color: var(--muted); line-height: 1.35; }
  .mo .card .sec-h h2 { font-size: var(--t-l); font-weight: 650; letter-spacing: -.01em; }
  .mo-tabwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  /* 1.83.0 · `table.mo-tab`, não `.mo-tab`: o mesmo nome servia a TABELA e os
     BOTÕES de filtro (`.mo-filtros button.mo-tab`). A regra min-width:620px
     caía nos botões também — cada filtro ficava com 620 px e a barra de
     filtros passava a rolar sozinha. Era isto que se sentia como «apertado». */
  table.mo-tab { width: 100%; border-collapse: collapse; min-width: 620px; }
  table.mo-tab th { text-align: left; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 650; padding: 0 var(--s3) 8px 0; white-space: nowrap; }
  table.mo-tab td { padding: 11px var(--s3) 11px 0; border-top: 1px solid var(--hair); font-size: var(--t-s); vertical-align: top; }
  table.mo-tab td:last-child, table.mo-tab th:last-child { padding-right: 0; text-align: right; }
  table.mo-tab tr.ia-ok td { background: linear-gradient(0deg, rgba(30,144,112,.04), rgba(30,144,112,.04)); }
  /* os filtros são botões: alvo de dedo, largura do texto, nunca 620 px */
  .mo-filtros button.mo-tab {
    flex: none; width: auto; min-width: 0; display: inline-flex; align-items: center;
    min-height: 40px; padding: 0 15px; border-radius: 999px;
    border: 1px solid var(--hair); background: #fff; color: var(--muted);
    font: inherit; font-size: 13.5px; font-weight: 550; cursor: pointer;
    transition: background .16s var(--ease), border-color .16s var(--ease), color .16s var(--ease);
  }
  .mo-filtros button.mo-tab:hover { border-color: var(--hair-strong); color: var(--ink); }
  .mo-filtros button.mo-tab.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .mo-filtros button.mo-tab:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .mo-chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 650;
    color: color-mix(in srgb, var(--c, #8A8A8A) 82%, #151414);
    background: color-mix(in srgb, var(--c, #8A8A8A) 12%, #FFFFFF);
    border: 1px solid color-mix(in srgb, var(--c, #8A8A8A) 34%, transparent); white-space: nowrap; }
  .mo-chip::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c, #8A8A8A); }
  .mo-classe { display: inline-block; padding: 1px 6px; border-radius: 5px; font-size: 9.5px; letter-spacing: .08em; font-weight: 700; font-family: var(--ui); }
  .mo-classe.cli { background: #E7F5EF; color: #1B6B52; }
  .mo-classe.api { background: #EEF1F6; color: #4A5668; }
  .mo-classe.desconhecida { background: #F1EFEA; color: #6B6459; }
  /* 3 nov 2026 · o motor da execução, à vista enquanto ela corre (item 5 do dono) */
  .run-motor { border-top: 1px solid var(--line, #E7E2D8); padding-top: var(--s3); display: grid; gap: 6px; }
  .run-motor-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .run-motor-h b { font-size: 14px; }
  .run-motor-est { margin-left: auto; font-size: 11px; color: var(--muted); }
  .run-motor-p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .run-motor-l { margin: 0; padding-left: 16px; display: grid; gap: 2px; font-size: 12.5px; color: var(--muted); }
  .run-motor-l b { color: var(--ink); font-weight: 600; }
  .mo-cap { display: inline-block; padding: 1px 7px; border-radius: 6px; background: #F2F3F5; color: #3A3A40; font-size: 11px; }
  .mo-alerta { display: block; color: #7A4115; background: #FDF3EC; border: 1px solid #F3D9C6; border-radius: 8px; padding: 6px 8px; font-size: 11.5px; line-height: 1.4; }
  .mo-sens { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: var(--s3); }
  .mo-sens-i { border: 1px solid var(--hair); border-radius: var(--r-m); padding: var(--s3); background: #FCFCFD; display: grid; gap: 2px; }
  .mo-sens-i b { font-size: var(--t-s); }
  .mo-sens-i span { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
  .mo-sens-i em { font-style: normal; font-size: 11px; color: #7A4115; }
  .mo-custo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); margin-bottom: var(--s3); }
  .mo-custo > div { border: 1px solid var(--hair); border-radius: var(--r-m); padding: var(--s3); display: grid; gap: 2px; }
  .mo-custo span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
  .mo-custo b { font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

  /* o painel em cartões: só no telemóvel (no desktop a mesa já é grelha) */
  .mo-cards { display: none; }
  /* a barra de uma mão */
  .mobar { display: none; }
  @media (max-width: 1080px) {
    .mo-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 820px) {
    .mo-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); }
    .mo-kpi { padding: var(--s3); border-radius: var(--r-m); }
    .mo-kpi b { font-size: 23px; }
    .mo-custo { grid-template-columns: 1fr; }
    .mo-card { min-height: 104px; }
    .mo-cards {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2);
      margin: 0 0 var(--s4);
    }
    .mo-card {
      display: grid; align-content: start; gap: 2px; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-l);
      padding: var(--s3) var(--s3) calc(var(--s3) + 2px); box-shadow: none;
      -webkit-tap-highlight-color: transparent;
    }
    .mo-card.hot { border-color: rgba(180,131,11,.45); background: linear-gradient(0deg, #FFF8E6, #FFF8E6); }
    .mo-card:active { background: #F4F4F6; }
    .mo-card-k { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
    .mo-card b { font-size: 30px; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .mo-card-n { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
    .mobar {
      display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
      position: fixed; left: 0; right: 0; bottom: calc(62px + env(safe-area-inset-bottom)); z-index: 45;
      margin: 0; padding: 10px var(--s3) 10px var(--s4);
      background: rgba(252,252,253,.97); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-top: 1px solid var(--hair); box-shadow: 0 -8px 24px rgba(20,20,24,.07);
    }
    .mobar[hidden] { display: none; }
    .mobar-txt { flex: 1 1 190px; min-width: 0; display: grid; gap: 1px; }
    .mobar-txt b { font-size: 12.5px; }
    .mobar-txt span { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mobar-acts { display: flex; gap: 6px; flex: none; }
    .mobar .btn { min-height: 44px; padding: 0 var(--s4); }
    /* o conteúdo não fica escondido atrás da barra de decisões */
    main { padding-bottom: 180px; }
    .toast { bottom: 176px; }
    /* alvos de toque: 44 px em toda a mesa quando se usa o dedo */
    .chip, .row, .tabbar a, .crm-dup-i, .mo-card, .btn { touch-action: manipulation; }

  @media (max-width: 420px) {

  @media (prefers-reduced-motion: reduce) {

  }

  /* =========================================================================
     1.62.0 · A FOLHA DE BUSCA (telemóvel)

     Uma folha que sobe de baixo, com o campo no topo (onde o polegar chega
     depois de rolar), resultados em cartões de 44 px e a criação de uma tarefa
     a partir do resultado escolhido. No desktop nada disto aparece: lá há o
     Ctrl K e a caixa do cabeçalho.
     ========================================================================= */
  .hbusca { display: none; }
  @media (max-width: 820px) {
    .hbusca { display: inline-flex; width: 40px; height: 40px; align-items: center; justify-content: center;
      border-radius: 10px; color: var(--muted); background: transparent; border: 0; }
    .hbusca:active { background: #F2F4F7; }
    .hbusca .ic { width: 20px; height: 20px; }

  /* =========================================================================
     1.61.0 · EXECUÇÕES — a execução transparente

     O desenho serve uma pergunta de cada vez: em que estado está, o que fez, o
     que voltou, quem autorizou. Os passos parecem um caderno com entradas e
     saídas, não um log. No telemóvel cabe tudo numa coluna, com alvos de 44 px.
     ========================================================================= */
  .run-list { display: grid; gap: var(--s3); }
  .run-card { display: grid; gap: 6px; padding: var(--s4); border-radius: var(--r2);
    background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none;
    transition: border-color .15s ease, transform .15s ease; }
  .run-card:hover, .run-card:focus-visible { border-color: var(--accent); transform: translateY(-1px); }
  .run-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    background: color-mix(in srgb, var(--fg) 7%, transparent); padding: 2px 7px; border-radius: 999px; }
  .run-when { margin-left: auto; font-size: 11.5px; color: var(--muted); }
  .run-tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px dashed var(--line); color: var(--muted); }
  .run-tit { font-weight: 650; font-size: 15px; line-height: 1.3; }
  .run-nota { font-size: 12.5px; color: var(--bad, #b3261e); }
  .run-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: var(--muted); }
  .run-chip i.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); display: inline-block; margin-right: 5px; }
  .run-chip { display: inline-flex; align-items: center; }

  .run-cabeca { display: grid; gap: var(--s3); }
  .run-titulo { font-size: 20px; font-weight: 700; line-height: 1.25; }
  .run-estado-linha { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
  .run-porque { font-size: 13px; color: var(--muted); flex: 1 1 240px; }
  .run-ficha { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: var(--s3);
    padding: var(--s3); border-radius: var(--r1); background: color-mix(in srgb, var(--fg) 4%, transparent); }
  .run-ficha div { display: grid; gap: 1px; }
  .run-ficha span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }

    background: color-mix(in srgb, var(--fg) 4%, transparent); }

    background: color-mix(in srgb, #b26a00 9%, transparent); }
  .run-rec-txt { flex: 1 1 240px; display: grid; gap: 2px; }
  .run-rec-txt span { font-size: 12.5px; color: var(--muted); }
  .run-acts { flex-wrap: wrap; }
  .run-acts .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }

  .run-step { border: 1px solid var(--line); border-radius: var(--r2); padding: var(--s4);
    display: grid; gap: var(--s3); margin-bottom: var(--s3); background: var(--card); }
  .run-step[data-estado="falhou"] { border-color: color-mix(in srgb, #b3261e 40%, var(--line)); }
  .run-step[data-estado="a_espera"] { border-color: color-mix(in srgb, #b26a00 45%, var(--line)); }
  .run-step-h { display: flex; align-items: flex-start; gap: var(--s3); }
  .run-step-n { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--fg) 8%, transparent); }
  .run-step-h > div { flex: 1 1 auto; min-width: 0; }
  .run-bloco { display: grid; gap: 4px; }
  .run-k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .run-v { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .run-acoes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .run-acoes li { display: grid; gap: 2px; padding: 8px 10px; border-radius: var(--r1);
    background: color-mix(in srgb, var(--fg) 4%, transparent); border-left: 3px solid #1f7a4d; }

    background: color-mix(in srgb, #b3261e 10%, transparent); color: #8f1d17; }

  .run-registo { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .run-registo li { display: grid; grid-template-columns: 92px 1fr; gap: var(--s3); padding: 7px 0;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .run-registo li:last-child { border-bottom: 0; }
  .run-reg-em { font-size: 11.5px; color: var(--muted); }

  .mo-filtros { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: var(--s3);
    scrollbar-width: none; }

  }

    .run-card { padding: var(--s3); }
  }
  @media (prefers-reduced-motion: reduce) {
