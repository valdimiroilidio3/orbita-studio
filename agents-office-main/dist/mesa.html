<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Órbita — a mesa de trabalho</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<style>
  /* Órbita — a mesa de trabalho.
     Uma superfície sóbria para o trabalho que se faz todos os dias: o que precisa de ti, os
     leads, a conversa com cada um, o dinheiro. O escritório 3D é onde os agentes vivem; aqui é
     onde tu decides.
     Tokens desde o dia 1: espaçamento em múltiplos de 4, uma escala tipográfica, quatro cores
     semânticas. Nada abaixo inventa um valor que não venha destes. */
  :root {
    --bg: #F4F4F6;
    --card: #FFFFFF;
    --ink: #1B1B1F;
    --muted: #6E6E76;
    --faint: #9A9AA3;
    --hair: rgba(27,27,31,.09);
    --hair-strong: rgba(27,27,31,.16);
    --blue: #2B3BF2;
    --blue-soft: rgba(43,59,242,.09);
    --blue-soft-2: rgba(43,59,242,.16);
    --ok: #12805E; --ok-soft: #E6F4EE;
    --warn: #A16A00; --warn-soft: #FBF1DC;
    --risk: #B3361F; --risk-soft: #FBEBE7;
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --t-xs: 11px; --t-s: 13px; --t-m: 15px; --t-l: 18px; --t-xl: 26px; --t-2xl: 40px;
    --r-s: 10px; --r-m: 14px; --r-l: 18px; --r-xl: 22px;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif;
    --shadow: 0 1px 2px rgba(27,27,31,.04), 0 10px 30px rgba(27,27,31,.05);
    --ease: cubic-bezier(.2,.8,.2,1);
    --side: 236px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--ui); font-size: var(--t-m); line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 6px; }

  /* ---------- estrutura ---------- */
  .shell { display: flex; min-height: 100vh; }
  .side {
    width: var(--side); flex: none; padding: var(--s5) var(--s4);
    display: flex; flex-direction: column; gap: var(--s5);
    position: sticky; top: 0; height: 100vh;
  }
  /* o X de sair: a mesa é uma página inteira, e sem isto só se sai pelo endereço.
     Fica ao lado da marca, no canto, com 44 px de alvo (o mínimo para o dedo). */
  .side-top { display: flex; align-items: center; gap: var(--s2); }
  .side-top .brand { flex: 1; }
  .side-x {
    width: 34px; height: 34px; flex: none; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); border: 1px solid transparent;
    transition: background .18s var(--ease), color .18s var(--ease), border-color .18s var(--ease);
  }
  .side-x:hover { background: rgba(27,27,31,.06); color: var(--ink); border-color: var(--hair); }
  .side-x svg { width: 15px; height: 15px; }
  .brand { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s2); font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    border: 2.5px solid var(--blue); position: relative;
  }
  .brand .mark::after {
    content: ''; position: absolute; inset: 5px; border-radius: 50%; background: var(--blue);
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a {
    display: flex; align-items: center; gap: var(--s3);
    padding: 10px var(--s3); border-radius: var(--r-s);
    font-size: var(--t-m); color: var(--ink); font-weight: 450;
    transition: background .18s var(--ease), color .18s var(--ease);
  }
  .nav a:hover { background: rgba(27,27,31,.05); }
  .nav a.on { background: var(--blue-soft); color: var(--blue); font-weight: 550; }
  .nav a .ic { width: 20px; height: 20px; flex: none; color: var(--muted); }
  .nav a.on .ic { color: var(--blue); }
  .nav a .n { margin-left: auto; font-size: var(--t-xs); color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav a.on .n { color: var(--blue); }

  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--s3); }
  .meter { background: rgba(255,255,255,.7); border: 1px solid var(--hair); border-radius: var(--r-m); padding: var(--s3) var(--s4); }
  .meter .mrow { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); }
  .meter .lbl { font-size: var(--t-xs); color: var(--muted); letter-spacing: .01em; }
  .meter b { font-size: var(--t-m); font-variant-numeric: tabular-nums; font-weight: 600; }
  .meter .bar { height: 4px; border-radius: 4px; background: var(--hair); margin-top: var(--s2); overflow: hidden; }
  .meter .bar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; transition: width .4s var(--ease); }
  .meter small { display: block; margin-top: var(--s2); font-size: var(--t-xs); color: var(--faint); }
  .espaco { display: flex; flex-direction: column; gap: 2px; padding: 0 var(--s2); }
  .espaco label { font-size: var(--t-xs); color: var(--faint); }
  .espaco select { border: 1px solid var(--hair); background: #fff; border-radius: var(--r-s); padding: 6px var(--s2); font-size: var(--t-s); max-width: 100%; }

  main { flex: 1; min-width: 0; padding: var(--s6) var(--s6) var(--s7); }
  .wrap { max-width: 1120px; margin: 0 auto; }
  .head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s4); margin-bottom: var(--s5); }
  .head h1 { font-size: var(--t-2xl); font-weight: 680; letter-spacing: -.025em; line-height: 1.1; }
  .head .sub { margin-top: 6px; color: var(--muted); font-size: var(--t-m); }
  .head .sub b { color: var(--ink); font-weight: 600; }
  .head-acts { display: flex; gap: var(--s2); align-items: center; flex: none; }

  .pill {
    display: inline-flex; align-items: center; gap: var(--s2);
    padding: 11px var(--s4); border-radius: 999px; font-size: var(--t-m); font-weight: 550;
    background: var(--blue-soft); color: var(--blue); border: 1px solid transparent;
    transition: background .18s var(--ease), color .18s var(--ease);
  }
  .pill:hover { background: var(--blue-soft-2); }
  .pill .ic { width: 18px; height: 18px; }
  .pill.stop { background: var(--risk-soft); color: var(--risk); }
  .pill small { font-weight: 450; opacity: .8; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s3); margin-bottom: var(--s6); }
  .stat { background: var(--card); border-radius: var(--r-l); padding: var(--s4) var(--s5); box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 32px; font-weight: 650; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .stat b.blue { color: var(--blue); }
  .stat span { display: block; margin-top: 2px; color: var(--muted); font-size: var(--t-s); }

  h2 { font-size: var(--t-xl); font-weight: 650; letter-spacing: -.02em; }
  h3 { font-size: var(--t-l); font-weight: 620; letter-spacing: -.01em; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); }
  .sec-h .count { color: var(--muted); font-size: var(--t-s); }

  /* ---------- o par: lista + aprovação ---------- */
  .split { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: var(--s5); align-items: start; }
  .list { display: flex; flex-direction: column; gap: var(--s2); }
  .item {
    display: flex; align-items: center; gap: var(--s3); width: 100%; text-align: left;
    background: var(--card); border-radius: var(--r-l); padding: 15px var(--s4);
    border: 1.5px solid transparent; box-shadow: var(--shadow);
    transition: border-color .18s var(--ease), transform .18s var(--ease);
  }
  .item:hover { transform: translateY(-1px); }
  .item.on { border-color: var(--blue); }
  .item .who { min-width: 0; flex: 1; }
  .item .nm { font-size: 16px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .mt { color: var(--muted); font-size: var(--t-s); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    flex: none; font-size: var(--t-s); font-weight: 600; padding: 5px 10px; border-radius: 999px;
    background: var(--ok-soft); color: var(--ok); font-variant-numeric: tabular-nums;
  }
  .badge.mid { background: var(--warn-soft); color: var(--warn); }
  .badge.low { background: #F1F1F3; color: var(--muted); }
  .badge.blue { background: var(--blue-soft); color: var(--blue); }

  .card { background: var(--card); border-radius: var(--r-xl); padding: var(--s5); box-shadow: var(--shadow); }
  .detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); }
  .detail-top h3 { font-size: 28px; font-weight: 650; letter-spacing: -.025em; }
  .detail-top .mt { color: var(--muted); margin-top: 4px; font-size: var(--t-m); }
  .msg-label { display: flex; align-items: center; gap: var(--s2); color: var(--muted); font-size: var(--t-s); margin: var(--s5) 0 var(--s2); }
  .msg-label .ic { width: 16px; height: 16px; }
  .bubble {
    background: #EFF0FE; border-radius: var(--r-m); padding: var(--s4) var(--s5);
    font-size: var(--t-l); line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .why-box { border: 1px solid var(--hair); border-radius: var(--r-m); padding: var(--s3) var(--s4); margin-top: var(--s4); }
  .why-box summary { list-style: none; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 600; }
  .why-box summary::-webkit-details-marker { display: none; }
  .why-box summary span { color: var(--muted); font-weight: 400; font-size: var(--t-s); display: block; }
  .why-box summary .chev { transition: transform .2s var(--ease); color: var(--faint); }
  .why-box[open] summary .chev { transform: rotate(90deg); }
  .why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); margin-top: var(--s4); }
  .why {
    display: flex; gap: var(--s3); align-items: flex-start; background: #F6F6F8;
    border-radius: var(--r-s); padding: var(--s3) var(--s4); font-size: var(--t-s); line-height: 1.35;
  }
  .why .tick { color: var(--ok); flex: none; margin-top: 1px; }
  .acts { display: flex; gap: var(--s3); margin-top: var(--s5); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    padding: 15px var(--s5); border-radius: var(--r-m); font-size: var(--t-m); font-weight: 600;
    border: 1px solid transparent; transition: transform .12s var(--ease), background .18s var(--ease), opacity .18s var(--ease);
  }
  .btn:active { transform: scale(.99); }
  .btn.primary { background: var(--blue); color: #fff; flex: 1; }
  .btn.primary:hover { background: #2230D6; }
  .btn.ghost { background: #fff; border-color: var(--hair-strong); color: var(--ink); flex: 1; }
  .btn.ghost:hover { background: #FAFAFB; }
  .btn.small { padding: 9px var(--s4); font-size: var(--t-s); border-radius: var(--r-s); flex: none; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.quiet { background: transparent; border-color: transparent; color: var(--muted); padding: 9px var(--s2); flex: none; }

  /* 30 out 2026 · o aviso do modo local (pedido do dono: «chega de demonstrações só»).
     Não é um erro e não se fecha: é a informação de onde os dados vivem. Discreto no
     desktop, duas linhas no telemóvel, e as acções da cópia sempre à mão. */
  .localbar {
    display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap;
    margin: var(--s3) var(--s4) 0; padding: 10px 12px 10px 14px;
    background: #FFF8E6; border: 1px solid #F0DCB0; border-radius: var(--r2, 12px);
    font-size: var(--t-xs, 12px); line-height: 1.45; color: #6B5320;
  }
  .localbar b { color: #4A3A12; }
  .localbar > span:first-child { flex: 1 1 260px; min-width: 0; }
  .localbar .lb-act { display: flex; gap: 4px; flex: none; }
  .localbar .btn { color: #6B5320; }
  .localbar .btn:hover { color: #2F2609; }
  @media (max-width: 720px) {
    .localbar { margin: var(--s2) var(--s2) 0; font-size: 12px; }
    .localbar .lb-act { width: 100%; justify-content: flex-end; flex-wrap: wrap; }
  }
  /* ---- 1.18.0 · AI Control Center ---- */
  .ia-faixa { margin: var(--s3) var(--s4) 0; padding: 12px 14px; border-radius: var(--r2, 12px);
    font-size: var(--t-sm, 14px); line-height: 1.5; border: 1px solid; }
  .ia-faixa.ok { background: #EDF9F1; border-color: #CBE9D5; color: #1F5B37; }
  .ia-faixa.bad { background: #FDF3EC; border-color: #F3D9C6; color: #7A4115; }
  /* 1.50.0 · a conversa da IA: mensagens com quem falou e o que respondeu */
  .ia-chat { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto;
    padding: 10px 12px; margin: 0 0 10px; border: 1px solid var(--line); border-radius: var(--r2, 12px);
    background: var(--paper-2, rgba(0,0,0,.02)); }
  .ia-msg { display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; line-height: 1.5; max-width: 78ch; }
  .ia-msg b { font-family: var(--ui); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .ia-msg.eu { align-self: flex-end; align-items: flex-end; text-align: right; }
  .ia-msg.eu div { background: var(--ink); color: var(--paper); padding: 8px 12px; border-radius: 12px; }
  .ia-msg.ia div { background: #fff; border: 1px solid var(--line); padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; }
  .ia-msg.erro div { background: #FDF3EC; border: 1px solid #F3D9C6; color: #7A4115; padding: 8px 12px; border-radius: 12px; }
  .ia-faixa code { background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 6px; font-size: 12px; }
  .ia-sub { font-size: var(--t-xs, 12px); opacity: .72; line-height: 1.45; }
  .ia-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .ia-tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px;
    letter-spacing: .02em; border: 1px solid rgba(0,0,0,.12); background: #F2F2F0; white-space: nowrap; }
  .ia-tag.ok { background: #E7F6ED; border-color: #C3E5D2; color: #1F5B37; }
  .ia-tag.bad { background: #FBEDE7; border-color: #F0CFC0; color: #8A3A16; }
  .ia-tag.warn { background: #FEF7E4; border-color: #EBDBB2; color: #6E5410; }
  .ia-tab { width: 100%; border-collapse: collapse; font-size: var(--t-sm, 14px); }
  .ia-tab th { text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase;
    letter-spacing: .04em; opacity: .6; padding: 8px 10px; border-bottom: 1px solid var(--line, #E6E6E2); }
  .ia-tab td { padding: 9px 10px; border-bottom: 1px solid var(--line, #E6E6E2); vertical-align: top; }
  .ia-tab tr:last-child td { border-bottom: 0; }
  .ia-tab tr.ia-ok td:first-child { box-shadow: inset 3px 0 0 #2E9E63; }
  .ia-acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .ia-select { max-width: 320px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line, #DDD);
    background: #fff; font: inherit; font-size: 13px; }
  .ia-input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line, #DDD); font: inherit; font-size: 14px; line-height: 1.5; resize: vertical; }
  .ia-plano { margin: 10px 0; padding-left: 20px; font-size: 14px; }
  .ia-plano li { margin: 6px 0; }
  .ia-run-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
  .ia-run { border-left: 3px solid #2E9E63; }
  .ia-revisao { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #FAFAF8; }
  .ia-resultado { margin-top: 10px; }
  .ia-resultado pre { white-space: pre-wrap; font-size: 12.5px; line-height: 1.5; background: #FAFAF8;
    padding: 10px; border-radius: 10px; max-height: 420px; overflow: auto; }
  .ia-erro { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: #FBEDE7; color: #8A3A16; font-size: 13px; }
  .ia-erros { margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
  .ia-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .ia-ferramenta { border: 1px solid var(--line, #E6E6E2); border-radius: 10px; padding: 9px 11px; font-size: 13px; }
  .ia-ferramenta b { display: inline-block; margin-right: 6px; }
  .ia-linha-run { cursor: pointer; }
  .ia-linha-run:hover td { background: #FAFAF8; }
  @media (max-width: 720px) {
    .ia-faixa { margin: var(--s2) var(--s2) 0; }
    .ia-tab { font-size: 13px; }
    .ia-tab th:nth-child(4), .ia-tab td:nth-child(4) { display: none; }
    .ia-select { max-width: 100%; }
  }

  /* 1.17.0 · quando a base responde, a barra é só uma linha discreta a dizer isso */
  .basebar {
    display: flex; align-items: center; gap: 8px;
    margin: var(--s3) var(--s4) 0; padding: 7px 12px;
    background: #EDF9F1; border: 1px solid #CBE9D5; border-radius: var(--r2, 12px);
    font-size: var(--t-xs, 12px); color: #1F5B37;
  }
  .basebar .dot { width: 7px; height: 7px; border-radius: 50%; background: #2E9E63; flex: none; }
  @media (max-width: 720px) { .basebar { margin: var(--s2) var(--s2) 0; } }
  .btn.quiet:hover { color: var(--ink); }

  .hint { color: var(--muted); font-size: var(--t-s); margin-top: var(--s3); }
  .hint.bad { color: var(--risk); }
  .empty { text-align: center; padding: var(--s6) var(--s5); }
  .empty .ic { width: 34px; height: 34px; color: var(--faint); margin-bottom: var(--s3); }
  .empty h3 { margin-bottom: var(--s2); }
  .empty p { color: var(--muted); max-width: 46ch; margin: 0 auto; }

  /* ---------- tabela de leads ---------- */
  .tools { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; margin-bottom: var(--s4); }
  .search {
    flex: 1; min-width: 220px; display: flex; align-items: center; gap: var(--s2);
    background: #fff; border: 1px solid var(--hair); border-radius: 999px; padding: 10px var(--s4);
  }
  .search input { border: 0; outline: none; width: 100%; background: transparent; font-size: var(--t-m); }
  .search .ic { color: var(--faint); width: 18px; height: 18px; flex: none; }
  .chip {
    padding: 8px var(--s4); border-radius: 999px; font-size: var(--t-s); font-weight: 550;
    background: #fff; border: 1px solid var(--hair); color: var(--muted);
  }
  .chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .rows { background: var(--card); border-radius: var(--r-l); overflow: hidden; box-shadow: var(--shadow); }
  .row {
    display: grid; grid-template-columns: 1fr 150px 120px 92px; gap: var(--s3); align-items: center;
    width: 100%; text-align: left; padding: var(--s4) var(--s5); border-bottom: 1px solid var(--hair);
  }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: #FAFAFB; }
  .row .nm { font-weight: 600; letter-spacing: -.01em; }
  .row .mt { color: var(--muted); font-size: var(--t-s); margin-top: 1px; }
  .row .cell { color: var(--muted); font-size: var(--t-s); }
  .tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: var(--t-xs); font-weight: 600; background: #F1F1F3; color: var(--muted); }
  .tag.novo { background: var(--blue-soft); color: var(--blue); }
  .tag.contactado { background: var(--warn-soft); color: var(--warn); }
  .tag.respondeu, .tag.reuniao { background: var(--ok-soft); color: var(--ok); }
  .tag.cliente { background: #E7F0FF; color: #1B57C7; }
  .tag.perdido { background: var(--risk-soft); color: var(--risk); }

  /* ---------- projetos ---------- */
  .steps { list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--s2); margin-bottom: var(--s2); }
  .steps li { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-m); padding: var(--s3); position: relative; }
  .steps li b { display: block; font-size: var(--t-s); font-weight: 620; }
  .steps li small { display: block; color: var(--faint); font-size: 11px; line-height: 1.3; margin-top: 2px; }
  .steps li.done { border-color: rgba(18,128,94,.35); background: linear-gradient(0deg, var(--ok-soft), var(--ok-soft)); }
  .steps li.done b { color: var(--ok); }
  .steps li.now { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .steps li.now b { color: var(--blue); }
  .steps li.bad { border-color: rgba(179,54,31,.35); background: var(--risk-soft); }
  .steps li.bad b { color: var(--risk); }
  .qa-head { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s2); }
  .qa-list { list-style: none; display: grid; gap: var(--s2); margin-top: var(--s2); }
  .qa-list li { font-size: var(--t-s); color: var(--muted); border-left: 3px solid var(--hair); padding-left: var(--s3); line-height: 1.4; }
  .qa-list li.critico { border-color: var(--risk); }
  .qa-list li.importante { border-color: var(--warn); }
  .qa-list li.menor { border-color: var(--hair-strong); }
  .qa-list code { font-size: 11px; background: #F1F1F3; padding: 1px 5px; border-radius: 4px; color: var(--ink); }
  .feed { list-style: none; display: grid; gap: var(--s2); }
  .feed li { border-top: 1px solid var(--hair); padding-top: var(--s2); font-size: var(--t-s); }
  .feed li:first-child { border-top: 0; padding-top: 0; }
  @media (max-width: 820px) {
    .steps { grid-template-columns: 1fr 1fr; }
  }

  /* ---------- saldo ---------- */
  .cards2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
  .money { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); margin-bottom: var(--s5); }
  .money .card { padding: var(--s4) var(--s5); border-radius: var(--r-l); }
  .money b { display: block; font-size: 30px; font-weight: 650; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .money small { color: var(--muted); font-size: var(--t-s); }
  .money b.ok { color: var(--ok); } .money b.bad { color: var(--risk); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 650; padding: 0 var(--s2) var(--s2); }
  td { padding: 10px var(--s2); border-top: 1px solid var(--hair); font-size: var(--t-m); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .form { display: grid; grid-template-columns: 140px 1fr auto; gap: var(--s2); margin-bottom: var(--s5); }
  .form.three { grid-template-columns: 1fr 1fr 1fr; }
  .form.two { grid-template-columns: 1fr 1fr auto; }
  /* 1.36.0 · campos com rótulo por cima (editar um lead): o rótulo é pequeno e
     discreto, o campo ocupa o espaço todo, e em ecrã estreito passa a uma coluna */
  .form.pares { grid-template-columns: 1fr 1fr; align-items: end; }
  .fld { display: grid; gap: 4px; }
  .fld > span { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
  .fld .in { width: 100%; box-sizing: border-box; }
  .in { border: 1px solid var(--hair); background: #fff; border-radius: var(--r-s); padding: 11px var(--s3); font-size: var(--t-m); width: 100%; }

  /* ---------- estados, avisos, barra inferior ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: #1B1B1F; color: #fff; padding: 13px var(--s5); border-radius: 999px;
    font-size: var(--t-s); box-shadow: 0 16px 40px rgba(0,0,0,.22);
    opacity: 0; pointer-events: none; transition: opacity .22s var(--ease), transform .22s var(--ease); z-index: 60;
    max-width: min(560px, 90vw); text-align: center;
  }

  .toast.bad { background: var(--risk); }
  .tabbar { display: none; }
  /* o X do telemóvel: 44 px de alvo, no canto, sempre por cima do conteúdo */
  .m-x { display: none; }
  @media (max-width: 820px) {
    .m-x {
      display: inline-flex; position: fixed; top: 10px; right: 10px; z-index: 60;
      width: 44px; height: 44px; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(255,255,255,.96); color: var(--ink);
      border: 1px solid var(--hair); box-shadow: 0 1px 2px rgba(20,20,24,.06);
      -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }

    main { padding-top: calc(var(--s5) + 34px); }
  }
  .skeleton { color: var(--faint); padding: var(--s6); text-align: center; }

  @media (max-width: 1080px) {
    .split { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .row { grid-template-columns: 1fr 110px 92px; }
    .row .cell.hide-m { display: none; }
  }
  @media (max-width: 820px) {
    .side { display: none; }
    main { padding: var(--s5) var(--s4) 96px; }
    .head { flex-direction: column; gap: var(--s3); }
    .head h1 { font-size: 32px; }
    .stats { gap: var(--s2); }
    .stat { padding: var(--s3) var(--s4); border-radius: var(--r-m); }
    .stat b { font-size: 26px; }
    .card { padding: var(--s4); border-radius: var(--r-l); }
    .detail-top h3 { font-size: 24px; }
    .bubble { font-size: var(--t-m); }
    .why-grid { grid-template-columns: 1fr; }
    .money { grid-template-columns: 1fr; }
    .cards2 { grid-template-columns: 1fr; }
    .form, .form.three, .form.two, .form.pares { grid-template-columns: 1fr; }
    .acts { position: sticky; bottom: 84px; background: linear-gradient(to top, var(--bg) 70%, transparent); padding: var(--s2) 0; }
    .tabbar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
      border-top: 1px solid var(--hair); padding: 8px 4px calc(8px + env(safe-area-inset-bottom));
    }
    .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--muted); padding: 4px 0; border-radius: var(--r-s); }
    .tabbar a.on { color: var(--blue); font-weight: 600; }
    .tabbar .ic { width: 22px; height: 22px; }
    .row { grid-template-columns: 1fr auto; padding: var(--s3) var(--s4); }
    .row .cell, .row .cell.hide-m { display: none; }
    .toast { bottom: 96px; }
  }
  /* =========================================================================
     1.48.0 · O CINE — a direcção visual do estúdio

     Isto não é «mais uma página». A regra que segui, e que dá o resto:
       1 · uma cor de acento por ecrã, e o preto é uma cor (o hero é cinema);
       2 · tipografia grande com muito espaço: o nome da lead manda;
       3 · hierarquia por peso e espaço, não por caixas e riscos;
       4 · o movimento explica o que aconteceu (a gerar → aparece), nunca decora;
       5 · nada de sombras pesadas: uma luz por cartão, vinda de cima.
     ========================================================================= */
  .wrap.cine { max-width: 1120px; }
  .cine { --cine-escuro: #0B0B0F; --cine-luz: #F7F7FA; --cine-fio: rgba(255,255,255,.12); }

  /* ---------- o hero: preto profundo, uma luz que respira ---------- */
  .cine-hero {
    position: relative; overflow: hidden; isolation: isolate;
    border-radius: 28px; padding: clamp(24px, 4vw, 44px);
    background: radial-gradient(120% 140% at 12% -10%, #1E2340 0%, #0B0B0F 55%, #08080B 100%);
    color: #fff; margin-bottom: var(--s5);
    box-shadow: 0 30px 80px -40px rgba(11,11,15,.65);
  }
  .cine-hero.pequeno { padding: clamp(22px, 3vw, 34px); }
  .cine-hero-luz {
    position: absolute; inset: -40% -10% auto auto; width: 62%; aspect-ratio: 1;
    background: radial-gradient(circle, rgba(88,120,255,.55), rgba(88,120,255,0) 62%);
    filter: blur(6px); z-index: -1; animation: cine-respira 9s var(--ease) infinite alternate;
  }
  @keyframes cine-respira { from { transform: translate3d(0,0,0) scale(1); opacity: .75; } to { transform: translate3d(-4%,6%,0) scale(1.12); opacity: 1; } }
  .cine-hero-topo { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s5); }
  .cine-voltar { font-size: var(--t-s); color: rgba(255,255,255,.62); transition: color .2s var(--ease); }
  .cine-voltar:hover { color: #fff; }
  .cine-hero h1 {
    font-size: clamp(30px, 5vw, 54px); line-height: 1.02; letter-spacing: -.035em;
    font-weight: 640; margin: 0 0 var(--s2);
  }
  .cine-sub { color: rgba(255,255,255,.66); font-size: var(--t-m); max-width: 58ch; letter-spacing: -.005em; }
  .cine-selo {
    display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-xs);
    letter-spacing: .02em; text-transform: none; padding: 6px 12px; border-radius: 999px;
    background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16); color: #EDEDF5;
    backdrop-filter: blur(10px); white-space: nowrap;
  }
  .cine-selo.ia { background: rgba(96,128,255,.22); border-color: rgba(128,152,255,.45); color: #DCE3FF; }
  .cine-selo.regra { background: rgba(255,190,90,.14); border-color: rgba(255,190,90,.34); color: #FFE0AE; }
  .cine-selo.ok { background: rgba(70,200,150,.16); border-color: rgba(70,200,150,.4); color: #B8F0D8; }
  .cine-card .cine-selo { background: var(--blue-soft); border-color: transparent; color: var(--blue); }

  /* ---------- os passos: uma linha, quatro pontos ---------- */
  .cine-passos {
    display: flex; gap: clamp(10px, 3vw, 26px); list-style: none; margin: var(--s5) 0 0;
    padding: 0; flex-wrap: wrap;
  }
  .cine-passos li { display: flex; align-items: center; gap: 8px; font-size: var(--t-s); color: rgba(255,255,255,.5); transition: color .3s var(--ease); }
  .cine-passos li.feito, .cine-passos li.agora { color: rgba(255,255,255,.92); }
  .cine-ponto {
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font-size: 11px; border: 1px solid rgba(255,255,255,.24); color: rgba(255,255,255,.7);
    transition: background .3s var(--ease), border-color .3s var(--ease), transform .3s var(--ease);
  }
  .cine-passos li.feito .cine-ponto { background: rgba(70,200,150,.9); border-color: transparent; color: #04120C; }
  .cine-passos li.agora .cine-ponto { border-color: #7B93FF; box-shadow: 0 0 0 4px rgba(123,147,255,.16); transform: scale(1.05); }

  /* ---------- cartões ---------- */
  .cine-card {
    background: var(--card); border-radius: 22px; padding: clamp(18px, 2.6vw, 30px);
    box-shadow: 0 1px 0 var(--hair), 0 18px 44px -34px rgba(27,27,31,.5);
    margin-bottom: var(--s4); border: 1px solid rgba(27,27,31,.045);
    animation: cine-entra .5s var(--ease) both;
  }
  @keyframes cine-entra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .cine-card-h { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s3); flex-wrap: wrap; }
  .cine-card h2 { font-size: var(--t-l); letter-spacing: -.02em; font-weight: 620; }
  .cine-card h3 { font-size: var(--t-s); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: var(--s4) 0 var(--s2); font-weight: 600; }
  .cine-min { color: var(--faint); font-size: var(--t-xs); letter-spacing: .01em; }
  .cine-leitura { font-size: var(--t-m); line-height: 1.6; color: var(--ink); max-width: 68ch; }

  .cine-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--s2); }
  .cine-chip {
    font-size: var(--t-xs); padding: 4px 10px; border-radius: 999px;
    background: rgba(27,27,31,.05); color: var(--muted); border: 1px solid transparent;
  }
  .cine-chip.bom { background: var(--ok-soft); color: var(--ok); }
  .cine-chip.falta { background: var(--warn-soft); color: var(--warn); }

  /* ---------- as secções do Master Prompt: uma lista de definições limpa ---------- */
  .cine-seccoes { display: grid; gap: var(--s3); margin: 0; }
  .cine-seccoes > div { display: grid; grid-template-columns: 168px 1fr; gap: var(--s3); align-items: baseline; }
  .cine-seccoes dt { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); font-weight: 600; }
  .cine-seccoes dd { margin: 0; font-size: var(--t-m); line-height: 1.55; }
  @media (max-width: 720px) { .cine-seccoes > div { grid-template-columns: 1fr; gap: 2px; } }
  .cine-restricoes ul { list-style: none; display: grid; gap: 6px; }
  .cine-restricoes li { font-size: var(--t-s); color: var(--muted); padding-left: 18px; position: relative; }
  .cine-restricoes li::before { content: '—'; position: absolute; left: 0; color: var(--faint); }
  .cine-pre {
    margin-top: var(--s4); padding: var(--s4); border-radius: 14px; background: #0B0B0F; color: #D8DCEA;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.6;
    white-space: pre-wrap; overflow-x: auto;
  }

  /* ---------- controlos ---------- */
  .cine-fld { display: flex; flex-direction: column; gap: 6px; margin-top: var(--s3); }
  .cine-fld > span { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 600; }
  .cine-in {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--hair-strong);
    background: #FCFCFD; font-size: var(--t-m); transition: border-color .18s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease);
  }
  .cine-in:focus { outline: none; border-color: rgba(43,59,242,.45); background: #fff; box-shadow: 0 0 0 4px rgba(43,59,242,.08); }
  .cine-in.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.55; }
  .cine-duo { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
  @media (max-width: 640px) { .cine-duo { grid-template-columns: 1fr; } }
  .cine-grupo { margin-top: var(--s4); }
  .cine-rotulo { font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .09em; color: var(--faint); font-weight: 600; display: block; margin-bottom: 8px; }
  .cine-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .cine-pill {
    padding: 8px 14px; border-radius: 999px; font-size: var(--t-s); color: var(--muted);
    border: 1px solid var(--hair-strong); background: #fff;
    transition: all .22s var(--ease); transform: translateZ(0);
  }
  .cine-pill:hover { border-color: rgba(43,59,242,.35); color: var(--ink); transform: translateY(-1px); }
  .cine-pill.on { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 10px 24px -14px rgba(43,59,242,.9); }

  .cine-acts { display: flex; gap: var(--s2); margin-top: var(--s4); flex-wrap: wrap; align-items: center; }
  .cine-acts-min { display: inline-flex; gap: var(--s3); align-items: center; }
  .cine-btn {
    padding: 12px 20px; border-radius: 999px; font-size: var(--t-s); font-weight: 560;
    background: #fff; border: 1px solid var(--hair-strong); color: var(--ink);
    transition: transform .18s var(--ease), box-shadow .22s var(--ease), background .18s var(--ease), opacity .2s var(--ease);
  }
  .cine-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 26px -20px rgba(27,27,31,.7); }
  .cine-btn.primario { background: #0B0B0F; color: #fff; border-color: transparent; }
  .cine-btn.primario:hover { background: #16161D; }
  .cine-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .cine-link { font-size: var(--t-s); color: var(--blue); padding: 4px 2px; border-radius: 8px; transition: opacity .2s var(--ease); }
  .cine-link:hover { opacity: .7; }
  .cine-link.perigo { color: var(--risk); }

  /* ---------- o esqueleto: a imagem a nascer, não uma imagem falsa ---------- */
  .cine-skeleton {
    aspect-ratio: 16 / 10; border-radius: 16px; width: 100%;
    background: linear-gradient(100deg, #EEEEF2 20%, #F7F7FA 40%, #EEEEF2 60%);
    background-size: 220% 100%; animation: cine-brilho 1.4s linear infinite;
  }
  .cine-skeleton.alto { aspect-ratio: 21 / 6; margin-top: var(--s4); }
  @keyframes cine-brilho { from { background-position: 120% 0; } to { background-position: -120% 0; } }

  /* ---------- a galeria ---------- */
  .cine-galeria { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--s3); margin-top: var(--s3); }
  .cine-fig { margin: 0; border-radius: 18px; overflow: hidden; background: #F4F4F7; position: relative; }
  .cine-fig img { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; transition: transform .6s var(--ease); }
  .cine-fig:hover img { transform: scale(1.035); }
  /* 1.53.2 · o vídeo composto: leitor com cantos redondos e a mesma linguagem das peças */
  .cine-fig-video { margin: 0 0 var(--s2); border-radius: 18px; overflow: hidden; background: #0b0d10; }
  .cine-fig-video video { width: 100%; display: block; aspect-ratio: 16 / 9; background: #0b0d10; }
  .cine-fig-video figcaption { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); padding: 10px 14px; background: #F4F4F7; }
  .cine-fig.aprovada { outline: 2px solid rgba(18,128,94,.55); outline-offset: 2px; }
  .cine-fig figcaption { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: #fff; flex-wrap: wrap; }
  .cine-sem-bytes { aspect-ratio: 4 / 3; display: grid; place-content: center; gap: 4px; text-align: center; color: var(--faint); font-size: var(--t-xs); padding: var(--s3); }

  /* ---------- a tabela dos modelos de vídeo ---------- */
  .cine-tabela { display: grid; gap: 2px; margin-top: var(--s3); border-radius: 14px; overflow: hidden; }
  .cine-linha { display: grid; grid-template-columns: 170px 1fr auto; gap: var(--s3); padding: 12px 14px; background: #FAFAFC; font-size: var(--t-s); align-items: baseline; }
  .cine-linha b { font-weight: 600; }
  .cine-linha span { color: var(--muted); }
  @media (max-width: 640px) { .cine-linha { grid-template-columns: 1fr; gap: 2px; } }

  /* ---------- histórico ---------- */
  .cine-tempo { list-style: none; display: grid; gap: 10px; }
  .cine-tempo li { font-size: var(--t-s); color: var(--ink); display: flex; gap: 10px; align-items: baseline; }
  .cine-tempo li .cine-min { font-variant-numeric: tabular-nums; }

  /* ---------- lista de projectos ---------- */
  .cine-grelha { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s4); }
  .cine-mini {
    display: flex; flex-direction: column; background: var(--card); border-radius: 20px; overflow: hidden;
    border: 1px solid rgba(27,27,31,.05); box-shadow: 0 18px 44px -38px rgba(27,27,31,.6);
    transition: transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .cine-mini:hover { transform: translateY(-3px); box-shadow: 0 30px 60px -40px rgba(27,27,31,.7); }
  .cine-mini img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
  .cine-mini-vazio { aspect-ratio: 16 / 10; display: grid; place-items: center; background: linear-gradient(135deg, #0B0B0F, #1B2140); color: rgba(255,255,255,.5); font-size: var(--t-xs); }
  .cine-mini-txt { padding: var(--s4); display: grid; gap: 4px; }
  .cine-mini-txt b { font-size: var(--t-m); letter-spacing: -.01em; font-weight: 600; }
  .cine-conceito { font-size: var(--t-s); color: var(--muted); line-height: 1.5; }

  .cine-alerta {
    margin-top: var(--s3); padding: 12px 14px; border-radius: 12px; font-size: var(--t-s);
    background: var(--risk-soft); color: var(--risk); border: 1px solid rgba(179,54,31,.16);
  }
  .cine-alerta.suave { background: var(--warn-soft); color: var(--warn); border-color: rgba(161,106,0,.16); }
  .cine-vazio { text-align: center; display: grid; gap: var(--s3); justify-items: center; }
  .cine-vazio p { color: var(--muted); max-width: 52ch; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
