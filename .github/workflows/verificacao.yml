# Órbita — o gate automático.
#
# Dois trabalhos independentes:
#   · gate   — o mesmo `check.mjs` que se corre à mão: integrações, operação, build, a camada
#              do escritório (acessibilidade, tabuleiro, câmara, circulação, painel, botões),
#              o palco 3D, um browser a sério e o servidor isolado;
#   · suites — todas as 65 suites de `*.test.mjs`, que cobrem o resto (calendário, quadro,
#              Cérebro, CRM, mídia, rotinas…).
#
# Se um passo ficar vermelho, o pull request fica vermelho com ele — em vez de se descobrir
# no deploy que o gate já estava a mentir.
name: verificação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 1.79.3 · 22 e só 22 — e a razão é concreta: a base de operação do
        # escritório (`src/ops/db.mjs`) usa `node:sqlite`, que só existe a partir
        # do Node 22.4. Com o CI em 20, metade das suites falhava por uma coisa
        # que não era código da aplicação. `engines.node` passou a dizer a verdade.
        node: [22]
    defaults:
      run:
        working-directory: agents-office-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agents-office-main/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # O smoke abre um Chrome a sério. O ubuntu-latest traz o Google Chrome; o `channel: 'chrome'`
      # do playwright-core usa esse, sem descarregar browsers. Noutra máquina: CHROME_PATH.
      - name: Build + testes + smoke
        run: |
          set +e
          node check.mjs > /tmp/gate.log 2>&1
          code=$?
          grep -E "^✗" /tmp/gate.log | head -20 | while IFS= read -r l; do
            echo "::error title=falhou::${l}"
          done
          { echo '### gate'; echo '```'; tail -40 /tmp/gate.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 1.79.3 · a mesma razão do `gate`: `node:sqlite` (a base de operação do
        # escritório) só existe a partir do Node 22.4 — e o `engines.node` passou
        # a dizer a verdade. Com o CI em 20, metade das suites falhava por Node,
        # não por código.
        node: [22]
    defaults:
      run:
        working-directory: agents-office-main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: agents-office-main/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # As suites leem `dist/`, que está versionado — constrói-se na mesma para provar que o
      # bundle sai do código que está no commit.
      - name: Build
        run: node build.mjs

      # 1.79.3 · quando fica vermelho, o pull request diz QUAL teste falhou. Antes só se
      # via «Process completed with exit code 1» — e os logs da acção não são legíveis
      # de todo o lado (nem de um agente). A anotação e o resumo ficam na página do PR.
      - name: Todas as suites
        run: |
          set +e
          node --test > /tmp/suites.log 2>&1
          code=$?
          grep -E "^not ok" /tmp/suites.log | head -20 | while IFS= read -r l; do
            echo "::error title=falhou::${l}"
          done
          { echo '### suites'; echo '```'; grep -E "^# (tests|pass|fail)|^not ok" /tmp/suites.log | head -30; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $code -ne 0 ]; then { echo '### fim do registo'; echo '```'; tail -80 /tmp/suites.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          exit $code
